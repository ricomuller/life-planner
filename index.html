<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lernstand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kopfzeile mit Tabs, cleanes Design ohne Mathekästchen */
:root{
  --bg:#f4f6f9; --grid:rgba(47,91,211,.00); --surface:#ffffff; --ink:#17202b; --muted:#5b6677; --line:#d6dce4;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e4eaf7;
  --ok:#1f8a5b; --warn:#b7791f; --bad:#c2413b;
  --s-en:#5f6e84;
  --heat0:#e3e8ef; --uni:#dfe4ec; --uni2:#eef1f5; --own:#8a5a12;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --grid:rgba(124,156,255,.00); --surface:#161d27; --ink:#e5eaf1; --muted:#95a1b3; --line:#2a3441;
  --accent:#7c9cff; --accent-ink:#0e131a; --soft:#1e2940;
  --ok:#4cc38a; --warn:#e0a84a; --bad:#f07a73;
  --s-en:#9aa8bd;
  --heat0:#1e2631; --uni:#232c38; --uni2:#1b232d; --own:#e0b060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --grid:rgba(124,156,255,.00); --surface:#161d27; --ink:#e5eaf1; --muted:#95a1b3; --line:#2a3441;
  --accent:#7c9cff; --accent-ink:#0e131a; --soft:#1e2940;
  --ok:#4cc38a; --warn:#e0a84a; --bad:#f07a73;
  --s-en:#9aa8bd;
  --heat0:#1e2631; --uni:#232c38; --uni2:#1b232d; --own:#e0b060; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;padding:0;}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:1.35rem;letter-spacing:.01em}

.tabs{display:flex;flex-wrap:nowrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.pill-ok{color:var(--ok)} .pill-bad{color:var(--bad)} .pill-warn{color:var(--warn)}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
@media (max-width:620px){.hero{grid-template-columns:1fr; gap:10px;}}
.count{display:flex;gap:18px;flex-wrap:wrap}
.count div{display:flex;flex-direction:column}
.count .big{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;line-height:1.1}
.unilist{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.unilist div{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center}
@media (max-width:480px){.unilist div{grid-template-columns:1fr auto;gap:0 10px}.unilist div>span:first-child{grid-column:1/-1}}
.block{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 16px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--accent))}
.block.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.block.skipped{opacity:.75}
.block .time{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.status{font-weight:600;font-size:.9rem}
.openhint{font-size:.9rem;background:var(--soft);border-radius:7px;padding:8px 10px;white-space:pre-wrap}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:10px 12px}
.timer .clock{font-family:var(--f-mono);font-size:1.7rem;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--heat0);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.list{display:flex;flex-direction:column}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;min-width:0; font-size:16px;}
textarea{resize:vertical;min-height:80px;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.topic.done span{text-decoration:line-through;color:var(--muted)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--heat0)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--heat0))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--heat0))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--heat0))}
.heat i.l4{background:var(--accent)}
.heat i.t{outline:2px solid var(--ink);outline-offset:-1px}
.heat i.x{opacity:.35}
.hbar{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center}
.banner{border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(480px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dialog label,.logform label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;min-width:0}
.dialog .two,.logform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logform{border-top:1px solid var(--line);padding-top:12px}
.logform fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px}
.logform fieldset legend{font-weight:600;font-size:.85rem;padding:0 4px}
.logform fieldset label{flex-direction:row;align-items:center;gap:10px;font-weight:400}
.proto{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.92rem}
.proto .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.proto .txt.open{color:var(--warn)}
.proto em{font-style:normal;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.dialog .three{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
@media (max-width:440px){.dialog .three{grid-template-columns:1fr}.dialog .two{grid-template-columns:1fr}}
.dialog fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px}
.dialog fieldset legend{font-weight:600;font-size:.85rem;padding:0 4px}
.dialog fieldset label{flex-direction:row;align-items:center;gap:10px;font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.95rem;z-index:20;text-align:center;}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;padding:6px;border-radius:5px}
.xbtn:hover{color:var(--bad)}
/* Kalender */
.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cal{display:grid;grid-template-columns:48px repeat(7,minmax(104px,1fr));min-width:780px}
.cal .hd{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 6px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cal .hd.today b{color:var(--accent)}
.cal .gut{position:relative;border-right:1px solid var(--line)}
.cal .gut span{position:absolute;right:6px;transform:translateY(-50%);font:.68rem var(--f-mono);color:var(--muted)}
.daycol{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 48px);cursor:copy}
.daycol:last-child{border-right:0}
.daycol.today{background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.daycol.sun{background-color:color-mix(in srgb,var(--muted) 7%,transparent)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.ev{position:absolute;border-radius:6px;padding:3px 6px;font-size:.72rem;line-height:1.25;overflow:hidden;min-width:0}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{font-family:var(--f-mono);font-size:.66rem;opacity:.85;white-space:nowrap}
.ev .loc{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.ev.uni{background:repeating-linear-gradient(135deg,var(--uni) 0 6px,var(--uni2) 6px 12px);border:1px solid var(--line);border-top:3px solid var(--c,var(--muted));color:var(--ink);cursor:default;z-index:1}
.ev.uni{cursor:pointer}
.ev.uni.cancelled{opacity:.45;border-style:dashed}
.ev.uni.cancelled b{text-decoration:line-through}
.ev.own{background:color-mix(in srgb,var(--own) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--own) 50%,var(--line));border-left:4px solid var(--own);color:var(--ink);cursor:pointer;z-index:2}
.unilist .cancelled>span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--muted)}
.unilist .cancelled{opacity:.75}
.ownchip{background:color-mix(in srgb,var(--own) 18%,var(--surface));color:var(--own)}
.daycol.away{background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--own) 14%,transparent) 0 6px,transparent 6px 12px),repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 48px)}
.awaytag{border:0;cursor:pointer;font:600 .7rem var(--f-body);background:color-mix(in srgb,var(--own) 20%,var(--surface));color:var(--own);border-radius:4px;padding:1px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.awaycard{border-left:4px solid var(--own)}
.ev.learn{background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));border-left:4px solid var(--c);color:var(--ink);cursor:grab;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.ev.learn.done{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:var(--ok);border-left-color:var(--ok)}
.ev.learn.skipped{opacity:.55;background:var(--surface)}
.ev.learn.skipped b{text-decoration:line-through}
.ev.learn.conflict{outline:2px dashed var(--bad);outline-offset:-2px}
.ev.learn.dragging{cursor:grabbing;z-index:6;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.ev .res{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize}
.ev .res::after{content:"absolute";left:50%;bottom:3px;width:24px;height:4px;margin-left:-12px;border-radius:2px;background:var(--c);opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
/* Protokoll */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.9rem;font-weight:600;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.entry:first-of-type{border-top:0}
.entry .txt{grid-column:2/-1;white-space:pre-wrap;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.entry .txt.open{color:var(--warn)}
.entry .txt em{font-style:normal;font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:0}
.subtabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c,var(--accent))}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.wkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wkrow:first-child{border-top:0}
.wkrow input{accent-color:var(--ok)}
.wkrow.done b{color:var(--ok)}
.wkrow.future{opacity:.6}
.tick{color:var(--ok);font-weight:800}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.counts label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600;color:var(--muted)}
.counts input{width:100%}
.wkgrid{display:grid;grid-template-columns:1fr;gap:10px}
.wkcell{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.wkcell>label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.95rem;width:200px;flex:none}
.wkcell input[type=checkbox]{accent-color:var(--ok)}
.wkcell.done{background:color-mix(in srgb,var(--ok) 8%,var(--surface));border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.wkcell.done label{color:var(--ok)}
.wkcell .grow{min-width:180px;font-size:.85rem;padding:6px 10px}
.worked{color:var(--ok);font-weight:600}
/* Vorhaben, Woche */
.goalbox{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-left:3px solid var(--accent);border-radius:6px;padding:12px;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.goalbox em,.goalform label{font-style:normal;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-right:8px}
.goalform{display:flex;flex-direction:column;gap:8px;border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:8px;padding:12px}
.goalform label{text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink)}
fieldset.gm{flex-direction:row;flex-wrap:wrap;gap:8px 20px}
fieldset.sat{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:8px;padding:12px;margin:0}
fieldset.sat legend{font-weight:600;font-size:.9rem;padding:0 4px}
fieldset.sat label{position:relative;display:inline-flex}
fieldset.sat input{position:absolute;opacity:0;width:1px;height:1px}
fieldset.sat span:not(.small){display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 1rem var(--f-mono);cursor:pointer}
fieldset.sat input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
fieldset.sat input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.satbars{display:flex;align-items:flex-end;gap:4px;height:34px;margin:4px 0 2px}
.satbars span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:16px}
.satbars i{display:block;width:100%;min-height:2px;background:var(--accent);border-radius:3px 3px 0 0}
.satbars small{font:.6rem var(--f-mono);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.planday{display:grid;grid-template-columns:110px 1fr;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.planday:first-child{border-top:0;padding-top:0}
.planrow{display:grid;grid-template-columns:44px auto 1fr auto;gap:10px;align-items:center;border-left:3px solid var(--c);padding-left:10px}
.planrow input{width:100%}
@media (max-width:560px){.planday{grid-template-columns:1fr}.planrow{grid-template-columns:44px 1fr auto}.planrow>span:nth-child(2){display:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stats>div{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:8px;padding:12px}
.stats b{font-size:1.25rem}
.rate{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-family:var(--f-mono)}
.rate.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Mini-Ansicht */
body.is-mini{background-image:none}
body.is-mini .wrap{padding-block:8px;padding-inline:10px;max-width:none}
.mini{min-height:calc(100vh - 16px);display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;max-width:520px;margin:0 auto}
.mini-top{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.mini-clock{font:700 clamp(2.6rem,24vw,8rem)/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini.pause .mini-clock{color:var(--ok)}
.mini.pause .bar>i{background:var(--ok)}
.mini .bar{height:clamp(6px,1.5vw,10px)}
.mini-goal{font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
@media (max-height:260px){.mini-goal,.mini .bar{display:none}.mini{gap:4px}.mini-actions .btn{padding:6px 10px;font-size:.85rem}}
@media (max-height:180px){.mini-actions .btn:not(.primary){display:none}}
video.pipsrc{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
.timer.paused .clock,.mini.paused .mini-clock{color:var(--warn)}
.timer.paused{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.mini.paused .bar>i{background:var(--warn)}
/* Timer-Leiste */

</head>
<body>

<!-- Login Overlay (wird versteckt, sobald eingeloggt) -->
<div id="login-layer" class="overlay" style="display:none; z-index:9999; background:var(--bg)">
  <div class="dialog" style="gap:16px; max-width:360px">
    <h2 style="margin-bottom:0">Lernstand</h2>
    <p class="small muted" style="margin:0">Logge dich einmalig ein. Das Gerät merkt sich deine Anmeldung automatisch.</p>
    <label>E-Mail <input type="email" id="auth-email" placeholder="mail@domain.de"></label>
    <label>Passwort <input type="password" id="auth-pass"></label>
    <button class="btn primary" id="auth-btn">Einloggen</button>
    <div id="auth-err" class="small pill-bad" style="display:none; padding:8px; border-radius:6px; background:color-mix(in srgb,var(--bad) 10%,var(--surface))"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Lernstand</b><span class="muted small">& Alltag</span></div>
    <div class="row">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <button class="btn ghost small" data-act="theme" title="Design umschalten">🌓</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="layer"></div>

<script>
/* ---------- Echte Firebase-Datenbank ---------- */
const firebaseConfig = {
  // !!! WICHTIG: Füge hier deine Firebase-Config ein !!!
  apiKey: "DEIN_API_KEY",
  authDomain: "DEINE_PROJECT_ID.firebaseapp.com",
  projectId: "DEINE_PROJECT_ID",
  storageBucket: "DEINE_PROJECT_ID.appspot.com",
  messagingSenderId: "DEINE_SENDER_ID",
  appId: "DEINE_APP_ID"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// Theme initialisieren
const initTheme = () => {
  const savedTheme = localStorage.getItem('lt-theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
};
initTheme();

// Datenbank und App initialisieren
function initDB(db) {
  if (typeof S === 'undefined' || S.dbState === 'on') return; 
  
  window.claude = { use: (n) => Promise.resolve(n === 'db' ? db : null) };
  S.db = db; 
  S.dbState = 'on';
  
  const fail = () => { S.dbState = 'off'; render(); };
  db.collection('settings').onSnapshot(s=>{const d=s.docs.find(x=>x.id==='calUrl');if(d&&d.data().url){S.calUrl=d.data().url;ls.set('lt-calurl',S.calUrl);render()}},fail);
  db.collection('sessions').onSnapshot(s=>{S.sessions=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('subjects').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.subjects=m;render()},fail);
  db.collection('todos').onSnapshot(s=>{S.todos=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('chores').onSnapshot(s=>{S.chores=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('shopping').onSnapshot(s=>{S.shopping=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('subj').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data()});setSubjects(m);render()},fail);
  db.collection('std').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data()});S.std=m;render()},fail);
  db.collection('goals').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.goals=m;render()},fail);
  db.collection('weeks').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.weeks=m;render()},fail);
  db.collection('blocks').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});S.ov=m;indexOv();render()},fail);
  db.doc('uni/cancelled').onSnapshot(s=>{S.uniCancel=s.exists?{...(s.data().keys||{})}:{};render()},fail);
  db.collection('events').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data()});S.own=m;render()},fail);
  db.doc('uni/timetable').onSnapshot(s=>{if(s.exists){const d=s.data();setUni(d.events||[]);S.uniMeta={source:d.source,importedAt:d.importedAt}}else{setUni([]);S.uniMeta=null}render()},fail);
}

// Login-Überwachung
auth.onAuthStateChanged(user => {
  const layer = document.getElementById('login-layer');
  
  if (user && !user.email) {
    auth.signOut();
    return;
  }

  if (user) {
    layer.style.display = 'none';
    
    // Wartet im Hintergrund, bis das Grundgerüst der App geladen ist
    const waitForApp = setInterval(() => {
      if (typeof S !== 'undefined') {
        clearInterval(waitForApp);
        initDB(db);
      }
    }, 50);
    
  } else {
    layer.style.display = 'flex';
    document.getElementById('auth-btn').onclick = () => {
      const e = document.getElementById('auth-email').value;
      const p = document.getElementById('auth-pass').value;
      const errEl = document.getElementById('auth-err');
      errEl.style.display = 'none';
      
      auth.signInWithEmailAndPassword(e, p).catch(err => {
        errEl.style.display = 'block';
        errEl.textContent = 'Login fehlgeschlagen. Bitte prüfe E-Mail und Passwort.';
      });
    };
  }
});
</script>

<script>
/* ---------- Grundeinstellungen ---------- */
/* ---------- Fächer: frei anlegbar (Sammlung „subj"), Farben aus einer festen Palette ---------- */
let SUBJECTS=[],SUB={};
const PALETTE=[['#2f5bd3','#7c9cff'],['#1b8a64','#4cc38a'],['#c2601a','#f0944f'],['#7446cc','#b18cff'],['#0b86a0','#4fc4dc'],['#b8386f','#f07aa8'],['#5f6e84','#9aa8bd'],['#8a6d00','#e0c050'],['#c2413b','#f07a73'],['#3d7a2a','#8fd16a']];
const defSub=()=>SUBJECTS[0]?.id||'';
function setSubjects(m){SUBJECTS=Object.entries(m).map(([id,x])=>({id,...x,prio:x.prio||2,lp:x.lp||'',art:x.art||''})).sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name));
  SUB=Object.fromEntries(SUBJECTS.map(s=>[s.id,s]));
  const v=i=>SUBJECTS.map(s=>`--s-${s.id}:${PALETTE[(s.color||0)%PALETTE.length][i]}`).join(';');
  let el=document.getElementById('subjcolors');if(!el){el=document.createElement('style');el.id='subjcolors';document.head.appendChild(el)}
  el.textContent=`:root{${v(0)}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${v(1)}}}:root[data-theme="dark"]{${v(1)}}`}
/* Kürzel aus dem Namen: Anfangsbuchstaben der wichtigen Wörter plus Ziffern */
function autoShort(name){const stop=/^(der|die|das|und|für|in|von|mit|zu|im|an|des|den|dem|ein|eine)$/i;
  const w=name.replace(/[()]/g,' ').split(/[\s\-–]+/).filter(x=>x&&!stop.test(x));
  if(w.length===1)return w[0].replace(/\d+$/,'').slice(0,4)+(w[0].match(/\d+$/)||[''])[0];
  return w.map(x=>/^\d+$/.test(x)?x:x[0].toUpperCase()).join('').slice(0,6)}
const nextColor=()=>{const used=SUBJECTS.map(s=>s.color);for(let i=0;i<PALETTE.length;i++)if(!used.includes(i))return i;return SUBJECTS.length%PALETTE.length};
async function saveSubj(id,data){if(S.db)try{await S.db.doc('subj/'+id).set(data)}catch(e){toast(errMsg(e))}}
async function delSubj(id){if(S.db)try{await S.db.doc('subj/'+id).delete()}catch(e){toast(errMsg(e))}}
function needSubject(){if(SUBJECTS.length)return false;toast('Leg zuerst ein Fach an.');S.tab='faecher';ls.set('lt-fach','faecher');openDialog({type:'subj'});return true}
function subjDialogHTML(d){
  const s=d.editId?SUB[d.editId]||{}:{name:'',short:'',lp:'',prio:2,art:'',color:nextColor()};
  return `<h2 id="dlg-h">Fächer verwalten</h2>
    <div class="list">${SUBJECTS.map(x=>`<div class="stdrow" style="--c:var(--s-${x.id})"><span class="grow"><b>${esc(x.name)}</b> <span class="small muted">${esc(x.short)}${x.lp?' · '+x.lp+' LP':''} · Prio ${x.prio}</span></span>
      <button class="btn ghost small" data-act="subj-edit" data-id="${x.id}">Bearbeiten</button><button class="btn ghost small danger ${d.armDel===x.id?'arm':''}" data-act="subj-del" data-id="${x.id}">${d.armDel===x.id?'Wirklich löschen?':'Löschen'}</button></div>`).join('')||'<p class="small muted" style="margin:0">Noch keine Fächer. Leg sie hier an oder importiere deinen Stundenplan. Dann schlägt die App die Fächer daraus vor.</p>'}</div>
    <h3 style="margin-top:6px">${d.editId?'Fach bearbeiten':'Neues Fach'}</h3>
    <label>Name<input type="text" id="sj-name" maxlength="80" value="${esc(s.name)}" placeholder="z. B. Höhere Mathematik 1"></label>
    <div class="three"><label>Kürzel<input type="text" id="sj-short" maxlength="8" value="${esc(s.short)}" placeholder="automatisch"></label><label>LP <span class="muted small" style="font-weight:400">(optional)</span><input type="number" id="sj-lp" min="0" max="60" value="${s.lp||''}"></label><label>Priorität<select id="sj-prio">${[1,2,3].map(p=>`<option value="${p}" ${+s.prio===p?'selected':''}>${p}${p===1?' (hoch)':p===3?' (niedrig)':''}</option>`).join('')}</select></label></div>
    <label>Notiz <span class="muted small" style="font-weight:400">(optional)</span><input type="text" id="sj-art" maxlength="80" value="${esc(s.art)}" placeholder="z. B. Klausur, rechnen"></label>
    <fieldset class="swatches"><legend>Farbe</legend>${PALETTE.map((c,i)=>`<label title="Farbe ${i+1}"><input type="radio" name="sj-color" value="${i}" ${(s.color||0)===i?'checked':''}><span style="--sw:${c[0]};--swd:${c[1]}"></span></label>`).join('')}</fieldset>
    ${d.armDel?'<p class="small muted" style="margin:0">Beim Löschen bleiben Protokolle und Lernblöcke erhalten, sie zeigen dann aber kein Fach mehr an.</p>':''}
    <div class="row between"><span>${d.editId?'<button class="btn ghost" data-act="subj-new">Stattdessen neues anlegen</button>':''}</span>
      <span class="row"><button class="btn ghost" data-act="close">Schließen</button><button class="btn primary" data-act="subj-save">${d.editId?'Änderungen speichern':'Fach hinzufügen'}</button></span></div>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='subj-open'||act==='subj-new'){openDialog({type:'subj'});setTimeout(()=>document.getElementById('sj-name')?.focus(),30)}
  if(act==='subj-edit'){openDialog({type:'subj',editId:a.dataset.id})}
  if(act==='subj-del'){const d=S.dialog,id=a.dataset.id;if(d.armDel!==id){d.armDel=id;render();return}delSubj(id);if(S.fachSel===id){S.fachSel='all';ls.set('lt-fach','all')}openDialog({type:'subj'});toast('Fach gelöscht')}
  if(act==='subj-save'){const d=S.dialog,g=id=>document.getElementById(id).value,name=g('sj-name').trim();
    if(!name){toast('Gib dem Fach einen Namen.');return}
    const old=d.editId?SUB[d.editId]:null,id=d.editId||'f'+Date.now().toString(36);
    saveSubj(id,{name,short:g('sj-short').trim()||autoShort(name),lp:+g('sj-lp')||null,prio:+g('sj-prio')||2,art:g('sj-art').trim(),
      color:+(document.querySelector('input[name="sj-color"]:checked')?.value||0),order:old?.order??Date.now()});
    openDialog({type:'subj'});toast(d.editId?'Fach gespeichert':`„${name}“ angelegt`)}
});

const PHASES=[];
const FREE_DAYS=['2026-12-24','2026-12-25','2026-12-26','2026-12-31','2027-01-01'];
const TIPS=[
  'Kleine Ziele statt großer: „3 Aufgaben aus Blatt 2" statt „heute Mathe lernen".',
  '25 Minuten lernen, 5 Minuten Pause. Handy in einen anderen Raum.',
  'Fällt ein Block aus: nicht am Sonntag nachholen, sondern Samstag eine Stunde dranhängen.',
  'Altklausuren früh besorgen, sie zeigen, was wirklich drankommt.',
  'Die Freistunden zwischen den Vorlesungen sind deine wertvollste Zeit.',
  'Schreib nach jeder Session auf, was offen ist. Beim nächsten Mal startest du genau dort.',
];
const WEEK_TARGET_H=19;
const KIND_SHORT={Vorlesung:'V',Übung:'Ü',Seminar:'S',Praktikum:'P'};

/* ---------- Zeit ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dow=d=>(d.getDay()+6)%7;
const mondayOf=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-dow(d));
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const DS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON=['Jan','Feb','März','Apr','Mai','Juni','Juli','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtShort=k=>{const d=parse(k);return `${d.getDate()}.${MON[d.getMonth()]}`};
const fmtLong=k=>{const d=parse(k);return `${DAYS[dow(d)]}, ${d.getDate()}.${MONL[d.getMonth()]}`};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const todayKey=()=>key(new Date());
const fmtH=min=>(min/60).toLocaleString('de-DE',{maximumFractionDigits:1})+' h';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phaseOf=k=>PHASES.find(p=>k>=p.from&&k<=p.to)||null;

/* ---------- Zustand ---------- */
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const S={std:{},uniCancel:{},own:{},sessions:[],subjects:{},todos:[],chores:[],shopping:[],ov:{},ovBy:{},uni:[],uniBy:{},uniMeta:null,inline:null,todoEdit:null,goals:{},weeks:{},fachSel:ls.get('lt-fach')||'all',fachTab:'ueber',
  tab:ls.get('lt-tab')||'heute',weekOff:0,protoFilter:'all',dialog:null,fresh:false,drag:null,
  calUrl:ls.get('lt-calurl')||'',
  db:null,dbState:'loading',timer:(()=>{try{return JSON.parse(ls.get('lt-timer'))}catch{return null}})()};

/* ---------- Stundenplan ---------- */
const uniOn=k=>S.uniBy[k]||[];
const uniLabel=e=>e.own?e.t:`${SUB[e.sub]?.short\vert{}\vert{}e.t}${KIND_SHORT[e.k]||e.k}`;
/* Ausgefallene Uni-Termine: Schlüssel aus Datum, Uhrzeit und Art */
const evKey=e=>`${e.d}_${e.s.replace(':','')}_${KIND_SHORT[e.k]||'X'}`;
const isCancelled=e=>!!S.uniCancel[evKey(e)];
const uniActive=k=>uniOn(k).filter(e=>!isCancelled(e));
const hasPraktikum=k=>uniActive(k).some(e=>e.k==='Praktikum');
/* Eigene Termine: einmalig oder wöchentlich bis „until"; „skip" enthält einzeln entfernte Tage */
function ownOn(k){const out=[];Object.entries(S.own).forEach(([id,o])=>{if(o.type==='away')return;
  const hit=o.repeat==='weekly'?(k>=o.date&&(!o.until||k<=o.until)&&dow(parse(k))===dow(parse(o.date))):k===o.date;
  if(hit&&!(o.skip||[]).includes(k))out.push({own:true,id,d:k,s:o.start,e:o.end,t:o.title,l:o.place||'',repeat:o.repeat,until:o.until})});
  return out.sort((a,b)=>toMin(a.s)-toMin(b.s))}
function setUni(events){S.uni=events;const by={};events.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));for(const k in by)by[k].sort((a,b)=>toMin(a.s)-toMin(b.s));S.uniBy=by}

/* ---------- Lernblöcke nach Wochenrhythmus und Phase ---------- */
function nextExam(fromK){let best=null;for(const s of SUBJECTS){const e=S.subjects[s.id]?.examDate;if(e&&e>=fromK&&(!best||e<best.date))best={id:s.id,date:e}}return best}
const mk=b=>({...b,time:`${b.start}–${b.end}`,h:(toMin(b.end)-toMin(b.start))/60});
/* Jeden Abend 25 Minuten Englisch, auch am Wochenende; nur die komplett freien Feiertage bleiben frei */
const EN_START='21:30',EN_END='21:55';
/* Standard-Lernblöcke: wöchentlich wiederkehrend, selbst angelegt (Sammlung „std")
    Regel: {weekday 0=Mo…6=So, start, end, subjects, label, from, until} */
const STD_WD=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
function genBlocks(k){const w=dow(parse(k));
  return Object.entries(S.std).filter(([,r])=>+r.weekday===w&&k>=r.from&&(!r.until||k<=r.until))
    .map(([id,r])=>mk({id:k+'_std_'+id,date:k,slot:'std',std:id,start:r.start,end:r.end,subjects:r.subjects||[],label:r.label||''}))}
/* Abwesenheiten: ganze Tage von „date" bis „until"; mit pause:true fallen the Lernblöcke weg */
const awayOn=k=>Object.entries(S.own).filter(([,o])=>o.type==='away'&&k>=o.date&&k<=(o.until||o.date)).map(([id,o])=>({id,...o}));
const isAwayPause=k=>awayOn(k).some(a=>a.pause!==false);
function blocksFor(k){
  if(isAwayPause(k))return [];
  const gen=genBlocks(k).filter(b=>!S.ov[b.id]);
  const ov=(S.ovBy[k]||[]).filter(o=>!o.deleted).map(mk);
  return [...gen,...ov].sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function findBlock(id){if(S.ov[id])return S.ov[id].deleted?null:mk(S.ov[id]);return genBlocks(id.slice(0,10)).find(b=>b.id===id)||null}
const conflictOf=b=>[...uniActive(b.date),...ownOn(b.date)].find(e=>toMin(e.s)<toMin(b.end)&&toMin(e.e)>toMin(b.start));

/* ---------- Auswertung ---------- */
const done=()=>S.sessions.filter(s=>s.status!=='skipped');
const minutesOn=k=>done().filter(s=>s.date===k).reduce((a,s)=>a+(+s.minutes||0),0);
const statusOf=b=>S.sessions.find(s=>s.blockId===b.id);
/* Ausgefallene Blöcke zählen nicht mehr als geplant; ihr Ersatztermin zählt in der Woche, in der er liegt */
function weekStats(mon){let planned=0,got=0,skipped=0,noRepl=0;
  for(let i=0;i<7;i++){const k=key(addDays(mon,i));
    blocksFor(k).forEach(b=>{if(statusOf(b)?.status==='skipped'){skipped++;if(!replacementOf(b.id))noRepl++}else planned+=b.h*60});
    got+=minutesOn(k)}
  return {planned,got,skipped,noRepl}}
const skippedText=ws=>!ws.skipped?'nichts ausgefallen':`<span class="pill-warn">${ws.skipped} ${ws.skipped===1?'Block':'Blöcke'} ausgefallen${ws.noRepl?` · ${ws.noRepl} ohne Ersatztermin`:' · Ersatz eingeplant'}</span>`;
/* Uni-Stunden nach Art und Fach */
const KINDS=['Vorlesung','Übung','Seminar','Praktikum'];
const evH=e=>(toMin(e.e)-toMin(e.s))/60;
const numH=h=>h?h.toLocaleString('de-DE',{maximumFractionDigits:1}):'–';
function uniHours(from,to){const t={total:0};KINDS.forEach(k=>t[k]=0);
  S.uni.forEach(e=>{if(e.d<from||e.d>to||isCancelled(e))return;const h=evH(e);t.total+=h;t[e.k]=(t[e.k]||0)+h});return t}
const isPast=e=>{const k=todayKey();if(e.d!==k)return e.d<k;const n=new Date();return toMin(e.e)<=n.getHours()*60+n.getMinutes()};
function lastOpen(subject,exceptId){return S.sessions.filter(s=>s.subject===subject&&s.open&&s.id!==exceptId).sort((a,b)=>(b.at||0)-(a.at||0))[0]||null}

/* ---------- Speichern ---------- */
function toast(msg){const l=document.getElementById('layer');const t=document.createElement('div');t.className='toast';t.textContent=msg;l.appendChild(t);setTimeout(()=>t.remove(),2600)}
const errMsg=e=>e?.code==='quota_exceeded'?'Speicher voll: lösche alte Einträge, dann klappt es wieder.':'Speichern hat nicht geklappt. Versuch es gleich noch mal.';
async function addSession(o){o={...o,at:Date.now()};
  if(!S.db){S.sessions.push({id:'l'+Date.now(),...o});render();return}
  try{await S.db.collection('sessions').add(o)}catch(e){toast(errMsg(e))}}
async function updateSession(id,patch){
  if(!S.db){S.sessions=S.sessions.map(s=>s.id===id?{...s,...patch}:s);render();return}
  try{await S.db.doc('sessions/'+id).update(patch)}catch(e){toast(errMsg(e))}}
async function delSession(id){
  if(!S.db){S.sessions=S.sessions.filter(s=>s.id!==id);render();return}
  try{await S.db.doc('sessions/'+id).delete();toast('Eintrag gelöscht')}catch(e){toast(errMsg(e))}}
async function saveSubject(id,patch){

  const next={...cur,examDate:cur.examDate||null,topics:(cur.topics||[]).map(t=>({...t})),worked:{...(cur.worked||{})},itemNotes:{...(cur.itemNotes||{})},items:(cur.items||[]).map(i=>({...i})),...patch};
  S.subjects={...S.subjects,[id]:next};render();

  try{id?await S.db.doc('todos/'+id).update(data):await S.db.collection('todos').add(data)}catch(e){toast(errMsg(e))}}

async function saveBlock(b){
  const doc={date:b.date,start:b.start,end:b.end,subjects:b.subjects,label:b.label||'',custom:!!b.custom,deleted:!!b.deleted,...(b.replaces?{replaces:b.replaces}:{})};

  if(S.db)try{await S.db.doc('blocks/'+b.id).set(doc)}catch(e){toast(errMsg(e))}}
/* Vorhaben pro Lernblock und Wochenplanung/-rückblick */
const goalOf=id=>S.goals[id]?.goal||'';
async function saveGoal(blockId,date,text){
  text=(text||'').trim();if(text===goalOf(blockId))return;
  const g={...S.goals};if(text)g[blockId]={goal:text,date};else delete g[blockId];S.goals=g;render();
  if(S.db)try{text?await S.db.doc('goals/'+blockId).set({goal:text,date}):await S.db.doc('goals/'+blockId).delete()}catch(e){toast(errMsg(e))}}
const monKey=k=>key(mondayOf(parse(k)));
const weekOf=mon=>S.weeks[mon]||{};
async function saveWeek(mon,patch){
  const next={...weekOf(mon),...patch};S.weeks={...S.weeks,[mon]:next};render();
  if(S.db)try{await S.db.doc('weeks/'+mon).set(next)}catch(e){toast(errMsg(e))}}
/* Ersatztermin: nächster Samstag nach dem Block, direkt im Anschluss an den Samstagsblock */
function suggestReplacement(b){
  const len=toMin(b.end)-toMin(b.start);let d=addDays(parse(b.date),1);
  while(dow(d)!==5||FREE_DAYS.includes(key(d))||isAwayPause(key(d)))d=addDays(d,1);
  const k=key(d),last=blocksFor(k).filter(x=>x.slot!=='en').reduce((m,x),Math.max(m,toMin(x.end)),toMin('10:00'));
  let st=Math.ceil(last/15)*15;if(st+len>toMin('21:15'))st=Math.max(toMin('08:00'),toMin('21:15')-len);
  return {date:k,start:hm(st),end:hm(st+len)};
}
const replacementOf=id=>Object.values(S.ov).find(o=>o.replaces===id&&!o.deleted);
function skipBlock(b){
  addSession({date:b.date,blockId:b.id,subject:b.subjects[0]||defSub(),minutes:0,status:'skipped',note:'',open:''});
  if(replacementOf(b.id)){toast('Als ausgefallen markiert. Ein Ersatztermin steht schon.');return}
  openReplacement(b);
}
function openReplacement(b){
  const r=suggestReplacement(b);
  S.tab='kalender';ls.set('lt-tab','kalender');S.weekOff=weekOffOf(r.date);S.inline=null;
  openBlock({date:r.date,start:r.start,end:r.end,subjects:b.subjects,label:`Ersatz für ${DS[dow(parse(b.date))]} ${fmtShort(b.date)},${b.time}`,replaces:b.id,replacesText:`${DAYS[dow(parse(b.date))]},${fmtShort(b.date)}, ${b.time} ·${b.subjects.map(x=>SUB[x]?.short).join(' + ')}`},true);
  window.scrollTo(0,0);
}
async function setCancelled(key,val){const m={...S.uniCancel};if(val)m[key]=true;else delete m[key];S.uniCancel=m;render();
  if(S.db)try{await S.db.doc('uni/cancelled').set({keys:m})}catch(e){toast(errMsg(e))}}
async function saveOwn(id,data){S.own={...S.own,[id]:data};render();
  if(S.db)try{await S.db.doc('events/'+id).set(data)}catch(e){toast(errMsg(e))}}

async function delStd(id){const m={...S.std};delete m[id];S.std=m;render();if(S.db)try{await S.db.doc('std/'+id).delete()}catch(e){toast(errMsg(e))}}
/* Beenden: Vergangene Termine bleiben (mit ihren Protokollen), künftige fallen weg */
function endStd(id){const r=S.std[id];if(!r)return;const y=key(addDays(new Date(),-1));if(r.from>y)delStd(id);else saveStd(id,{...r,until:y})}
async function removeOverride(id){const o={...S.ov};delete o[id];S.ov=o;indexOv();render();
  if(S.db)try{await S.db.doc('blocks/'+id).delete()}catch(e){toast(errMsg(e))}}

/* ---------- Timer (25/5) ---------- */
const phaseText=i=>(i.paused?`Pausiert · Runde ${i.round}`:i.focus?`Fokus · Runde ${i.round}`:`Pause · Runde ${i.round}`)+(i.plus&&(i.focus||i.paused)?` · +${i.plus} min`:'');
/* Pausieren: pausedAt = Beginn der Unterbrechung, pausedMs = Summe aller Unterbrechungen */
const activeMs=t=>((t.pausedAt||Date.now())-t.start-(t.pausedMs||0));
function pauseTimer(){if(!S.timer||S.timer.pausedAt)return;S.timer={...S.timer,pausedAt:Date.now()};ls.set('lt-timer',JSON.stringify(S.timer));render();toast('Pausiert. Die Zeit läuft erst weiter, wenn du fortsetzt.')}
function resumeTimer(){const t=S.timer;if(!t||!t.pausedAt)return;S.timer={...t,pausedMs:(t.pausedMs||0)+(Date.now()-t.pausedAt),pausedAt:null};ls.set('lt-timer',JSON.stringify(S.timer));render();toast('Weiter geht’s')}
const pauseBtn=t=>(t.pausedAt?'':extendBtns(t))+(t.pausedAt?'<button class="btn primary" data-act="resume">Fortsetzen</button>':'<button class="btn" data-act="pause">Pausieren</button>');
/* Jede Runde: 25 min Fokus (plus Verlängerungen aus t.ext[runde], in ms), dann 5 min Pause */
const FOCUS_MS=25*60e3,PAUSE_MS=5*60e3;
function timerInfo(){if(!S.timer)return null;const ms=Math.max(0,activeMs(S.timer)),ext=S.timer.ext||{};let t=0,learned=0;
  for(let r=1;r<=300;r++){const fl=FOCUS_MS+(ext[r]||0),plus=Math.round((ext[r]||0)/60e3);
    const out=(focus,into,len)=>({focus,left:Math.max(0,Math.ceil((len-into)/1000)),phaseLen:len/1000,round:r,plus,
      focusMin:Math.max(1,Math.round((learned+(focus?into:0))/60e3)),paused:!!S.timer.pausedAt});
    if(ms<t+fl)return out(true,ms-t,fl);
    learned+=fl;t+=fl;
    if(ms<t+PAUSE_MS)return out(false,ms-t,PAUSE_MS);
    t+=PAUSE_MS}
  return {focus:false,left:0,phaseLen:300,round:300,plus:0,focusMin:Math.round(learned/60e3),paused:!!S.timer.pausedAt}}
/* Lernphase verlängern: verlängert die Fokusphase der aktuellen Runde; in der Pause geht es zurück in die Lernphase */
function extendTimer(min){const t=S.timer,i=timerInfo();if(!t||!i)return;const ext={...(t.ext||{})};ext[i.round]=(ext[i.round]||0)+min*60e3;
  S.timer={...t,ext};ls.set('lt-timer',JSON.stringify(S.timer));render();toast(i.focus?`Lernphase um ${min} Minuten verlängert`:`Zurück in die Lernphase, Pause verschoben`)}
const extendBtns=t=>timerStale(t)?'':`<button class="btn" data-act="extend" data-min="5" title="Lernphase verlängern">+5 min</button><button class="btn" data-act="extend" data-min="10" title="Lernphase verlängern">+10 min</button>`;
function startTimer(blockId,subject){S.timer={start:Date.now(),blockId,subject};ls.set('lt-timer',JSON.stringify(S.timer));render()}
function stopTimer(){const t=S.timer,i=timerInfo();S.timer=null;ls.set('lt-timer',null);
  const b=t.blockId?findBlock(t.blockId):null;
  const stale=timerStale(t);
  openLog({blockId:b?b.id:null,subject:t.subject,goal:t.goal||'',minutes:stale?Math.round(b?b.h*60:60):i.focusMin,date:b?b.date:key(new Date(t.start))});
  if(stale)toast('Der Timer lief sehr lange. Prüf die Minuten, bevor du speicherst.')}
/* Hängengebliebener Timer: länger als 4 Stunden oder seit einem anderen Tag */
const timerStale=t=>!!t&&(activeMs(t)>4*3600e3||key(new Date(t.start))!==todayKey());
/* Der Timer erscheint in seiner Lernblock-Karte unter „Heute", sonst als Leiste oben auf jeder Seite */
function timerShownInCard(){if(!S.timer||S.tab!=='heute')return false;if(!S.timer.blockId)return !timerStale(S.timer);
  const b=findBlock(S.timer.blockId);return !!b&&b.date===todayKey()&&!timerStale(S.timer)}
function timerBarHTML(){const t=S.timer;if(!t||timerShownInCard())return '';const i=timerInfo(),b=t.blockId?findBlock(t.blockId):null,stale=timerStale(t);
  const since=new Date(t.start),sinceTxt=`${key(since)===todayKey()?'heute':DS[dow(since)]+' '+fmtShort(key(since))} ${pad(since.getHours())}:${pad(since.getMinutes())}`;
  return `<div class="timerbar ${stale?'stale':''}" role="status" style="--c:var(--s-${t.subject||defSub()})">
    <span class="grow"><b>${stale?'Timer läuft noch seit '+sinceTxt:t.pausedAt?'Timer pausiert':'Timer läuft'}</b> ${chip(t.subject)} <span class="small muted">${b?`Lernblock ${DS[dow(parse(b.date))]} ${fmtShort(b.date)}, ${b.time}`:'Freie Session'}</span></span>
    ${stale?'':`<span class="clock" id="clock">${pad(Math.floor(i.left/60))}:${pad(i.left%60)}</span><span class="small muted" id="clockph">${phaseText(i)}</span>`}
    <span class="row">${stale?'':pauseBtn(t)}<button class="btn primary" data-act="stop">Beenden und eintragen</button>${stale?'':'<button class="btn" data-act="mini-on">Mini-Ansicht</button>'}<button class="btn ghost" data-act="cancel-timer">Verwerfen</button></span></div>`}
setInterval(()=>{const el=document.getElementById('clock');const i=timerInfo();if(!el||!i)return;
  el.textContent=`${pad(Math.floor(i.left/60))}:${pad(i.left%60)}`;
  const ph=document.getElementById('clockph');if(ph)ph.textContent=phaseText(i);
  const fm=document.getElementById('clockmin');if(fm)fm.textContent=`${i.focusMin} min gelernt`},1000);
const timerHTML=t=>`<div class="timer ${t.paused?'paused':''}"><span class="clock" id="clock">${pad(Math.floor(t.left/60))}:${pad(t.left%60)}</span><span class="grow"><b id="clockph">${phaseText(t)}</b><br><span class="small muted" id="clockmin">${t.focusMin} min gelernt</span></span>${pauseBtn(S.timer)}<button class="btn primary" data-act="stop">Beenden und eintragen</button><button class="btn" data-act="mini-on">Mini-Ansicht</button><button class="btn ghost" data-act="cancel-timer">Verwerfen</button></div>`;

/* ---------- Mini-Ansicht: nur der laufende Timer, für ein kleines Fenster in der Bildschirmecke ---------- */
S.mini=location.hash==='#mini';S.pip=null;
function phaseInfo(){const i=timerInfo();if(!i)return null;return {...i,pct:Math.min(100,(1-i.left/i.phaseLen)*100)}}
function viewMini(){
  const t=S.timer,i=phaseInfo();
  if(!t)return `<div class="mini"><div class="mini-top"><span class="muted small">Mini-Timer</span><button class="linkbtn small" data-act="mini-off">Vollansicht</button></div>
    <div class="mini-clock muted">--:--</div><p class="small muted" style="margin:0">Gerade läuft keine Lernsession.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" data-act="mini-start">Lernsession starten</button></div></div>`;
  const stale=timerStale(t),b=t.blockId?findBlock(t.blockId):null,goal=t.goal||(t.blockId?goalOf(t.blockId):'');
  return `<div class="mini ${i.paused?'paused':i.focus?'focus':'pause'}" style="--c:var(--s-${t.subject||defSub()})">
    <div class="mini-top">${chip(t.subject)}<b id="clockph" class="small">${stale?'Timer hängt':phaseText(i)}</b></div>
    <div class="mini-clock" id="clock">${stale?'--:--':`${pad(Math.floor(i.left/60))}:${pad(i.left%60)}`}</div>
    <div class="bar"><i id="clockbar" style="width:${stale?0:i.pct}%"></i></div>
    ${goal?`<div class="mini-goal" title="${esc(goal)}">${esc(goal)}</div>`:b?`<div class="mini-goal">${esc(b.label)}</div>`:''}
    <div class="mini-actions">${stale?'':pauseBtn(t)}<button class="btn ${t.pausedAt?'':'primary'}" data-act="mini-stop">Beenden</button><button class="btn" data-act="pip">Schwebendes Fenster</button><button class="btn ghost" data-act="mini-off">Vollansicht</button></div>
  </div>`}
/* Schwebendes Fenster: Bild-im-Bild über ein Canvas-Video, bleibt über anderen Fenstern */
function drawPip(c){const x=c.getContext('2d'),cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim()||'#000';
  const t=S.timer,i=phaseInfo();x.fillStyle=v('--surface');x.fillRect(0,0,c.width,c.height);
  if(!t||!i){x.fillStyle=v('--muted');x.font='600 28px sans-serif';x.textAlign='center';x.fillText('Kein Timer',c.width/2,c.height/2+10);return}
  const col=v(`--s-${t.subject}`)||v('--accent');x.fillStyle=col;x.fillRect(0,0,10,c.height);
  x.fillStyle=v('--muted');x.font='600 22px sans-serif';x.textAlign='left';x.fillText(`${SUB[t.subject]?.short\vert{}\vert{}''} ·${phaseText(i)}`,26,40);
  x.fillStyle=v('--ink');x.font='700 92px ui-monospace,Menlo,monospace';x.fillText(`${pad(Math.floor(i.left/60))}:${pad(i.left%60)}`,24,135);
  x.fillStyle=v('--heat0');x.fillRect(26,158,c.width-52,10);x.fillStyle=i.focus?col:v('--ok');x.fillRect(26,158,(c.width-52)*i.pct/100,10)}
async function openPip(){
  if(S.pip){try{await document.exitPictureInPicture()}catch{}return}
  try{
    const c=document.createElement('canvas');c.width=400;c.height=190;drawPip(c);
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.className='pipsrc';v.srcObject=c.captureStream(2);document.body.appendChild(v);
    await v.play();await v.requestPictureInPicture();
    const iv=setInterval(()=>drawPip(c),500);S.pip={v};
    v.addEventListener('leavepictureinpicture',()=>{clearInterval(iv);v.remove();S.pip=null;render()},{once:true});
    toast('Der Timer schwebt jetzt im eigenen Fenster. Zieh es in eine Ecke.');render();
  }catch(e){document.querySelector('video.pipsrc')?.remove();S.pip=null;
    toast('Ein schwebendes Fenster lässt der Browser hier nicht zu. Öffne die Mini-Ansicht stattdessen in einem kleinen Fenster.')}
}
setInterval(()=>{const b=document.getElementById('clockbar'),i=phaseInfo();if(b&&i)b.style.width=i.pct+'%'},1000);

/* ---------- Dialoge ---------- */
function openDialog(d){S.dialog=d;S.fresh=true;render();S.fresh=false}
/* Auf „Heute" öffnet sich das Protokoll direkt in der Karte des Lernblocks, sonst als Dialog */
function openLog(o){
  if(S.tab==='heute'&&o.blockId&&o.date===todayKey()&&blocksFor(o.date).some(b=>b.id===o.blockId)){
    S.dialog=null;S.inline={...o};S.fresh=true;render();S.fresh=false;
    setTimeout(()=>{const n=document.getElementById('inl-note');if(n){n.focus();n.scrollIntoView({block:'center',behavior:'smooth'})}},30);return}
  openDialog({type:'log',...o});setTimeout(()=>document.getElementById('dlg-note')?.focus(),30)}
const weekOffOf=k=>Math.round(diff(key(mondayOf(new Date())),key(mondayOf(parse(k))))/7);
const SAT={1:'gar nicht zufrieden',2:'eher unzufrieden',3:'okay',4:'zufrieden',5:'sehr zufrieden'};
const GM={yes:['Vorhaben erreicht','pill-ok'],partly:['Vorhaben teilweise erreicht','pill-warn'],no:['Vorhaben nicht erreicht','pill-bad']};
function protoHTML(s){return `<div class="proto">${s.rating?`<div class="txt"><em>Zufriedenheit</em><b class="mono">${s.rating}/5</b> <span class="muted">${SAT[s.rating]}</span></div>`:''}${s.goal?`<div class="txt"><em>Vorhaben</em>${esc(s.goal)}${s.goalMet&&GM[s.goalMet]?` <b class="${GM[s.goalMet][1]}">· ${GM[s.goalMet][0]}</b>`:''}</div>`:''}${s.note?`<div class="txt"><em>Geschafft</em>${esc(s.note)}</div>`:`<div class="txt pill-warn">Noch kein Protokoll. Was hast du geschafft?</div>`}${s.open?`<div class="txt open"><em>Offen</em>${esc(s.open)}</div>`:''}${s.worked?.length?`<div class="txt worked">✓ ${esc(s.worked.join(', '))}</div>`:''}</div>`}
function logFormHTML(d,p){
  const open=(S.subjects[d.subject]?.topics||[]).filter(t=>!t.done);
  const lo=lastOpen(d.subject,d.sessionId);
  return `<div class="logform stack" style="gap:12px">
    ${p==='inl'?`<h3>${d.sessionId?'Protokoll bearbeiten':'Protokoll zu dieser Session'}</h3>`:''}
    ${(()=>{const g=d.goal||(d.blockId?goalOf(d.blockId):'');if(!g)return '';const gm=d.goalMet||'';
      return `<div class="goalbox"><em>Dein Vorhaben</em>${esc(g)}</div>
      <fieldset class="gm"><legend>Hast du dein Vorhaben erreicht?</legend>${[['yes','Ja'],['partly','Teilweise'],['no','Nein']].map(([v,l])=>`<label><input type="radio" name="${p}-gm" value="${v}" ${gm===v?'checked':''}>${l}</label>`).join('')}</fieldset>`})()}
    <fieldset class="sat"><legend>Wie zufrieden bist du mit dieser Session?</legend>
      <div class="row">${[1,2,3,4,5].map(n=>`<label title="${SAT[n]}"><input type="radio" name="${p}-sat" value="${n}" ${+d.rating===n?'checked':''}><span>${n}</span></label>`).join('')}<span class="small muted">1 = gar nicht, 5 = sehr</span></div></fieldset>
    <div class="two"><label>Fach<select id="${p}-subj" data-act="log-subj" data-p="${p}">${subjOptions(d.subject)}</select></label>
      <label>Minuten<input id="${p}-min" type="number" min="1" max="720" step="5" value="${d.minutes||60}"></label></div>
    ${lo&&!d.sessionId?`<div class="openhint"><b>Letztes Mal offen (${fmtShort(lo.date)}):</b> ${esc(lo.open)}</div>`:''}
    <label>Was hast du geschafft?<textarea id="${p}-note" maxlength="1500" placeholder="z. B. Aufgaben 1–3 von Übungsblatt 4, Schnittgrößen verstanden">${esc(d.note||'')}</textarea></label>
    <label>Was ist offen, was nimmst du dir nächstes Mal vor?<textarea id="${p}-open" maxlength="1000" placeholder="z. B. Aufgabe 4 hängt bei der Lagerreaktion">${esc(d.open\vert{}\vert{}'')}</textarea></label>${(()=>{const cand=kindsFor(d.subject).flatMap(k=>itemsFor(d.subject,k)).filter(i=>!i.done&&i.past).slice(0,12);
      return cand.length?`<fieldset><legend>Welche Veranstaltungen hast du bearbeitet?</legend>${cand.map(i=>`<label><input type="checkbox" id="${p}-wk-${i.key}" data-wk="${i.key}">${esc(i.title)}${i.e?` <span class="small muted">${DS[dow(parse(i.e.d))]} ${fmtShort(i.e.d)}</span>`:''}</label>`).join('')}</fieldset>`:''})()}
    ${open.length?`<fieldset><legend>Themen erledigt?</legend>${open.map(t=>`<label><input type="checkbox" id="${p}-tp-${t.id}" data-tp="${t.id}">${esc(t.t)}</label>`).join('')}</fieldset>`:''}
    <p class="small muted" style="margin:0">Schreibst du „Vorlesung 2“ oder „Übung 1–3“ ins Feld „geschafft“, bekommt das im Fach automatisch ein grünes Häkchen.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="log-cancel" data-p="${p}">Abbrechen</button><button class="btn primary" data-act="save-log" data-p="${p}">Protokoll speichern</button></div>
  </div>`}
const kindSwitch=cur=>`<div class="subtabs" role="tablist" style="margin-top:-4px"><button role="tab" aria-selected="${cur==='block'}" data-act="dlg-kind" data-k="block">Lernblock</button><button role="tab" aria-selected="${cur==='own'}" data-act="dlg-kind" data-k="own">Termin</button><button role="tab" aria-selected="${cur==='away'}" data-act="dlg-kind" data-k="away">Abwesend</button></div>`;
function openAway(o){openDialog({type:'away',...o});setTimeout(()=>document.getElementById('away-title')?.focus(),30)}
function openOwn(o){openDialog({type:'own',...o})}
function openBlock(b,isNew){openDialog({type:'block',isNew,id:b.id||null,date:b.date,start:b.start,end:b.end,subjects:b.subjects||[],label:b.label||'',custom:isNew?true:!!b.custom,replaces:b.replaces||null,replacesText:b.replacesText||'',goal:b.id?goalOf(b.id):''})}
const subjOptions=(sel,blank)=>(blank?`<option value="">–</option>`:'')+SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
function dialogHTML(){const d=S.dialog;if(!d)return '';
  let inner='';
  if(d.type==='log'){
    const b=d.blockId?findBlock(d.blockId):null;
    inner=`<h2 id="dlg-h">${d.sessionId?'Protokoll bearbeiten':b?'Lernblock abschließen':d.goal?'Lernsession abschließen':'Lernzeit nachträglich eintragen'}</h2>

    inner=`<h2 id="dlg-h">Lernsession starten</h2>

    else{const x=isCancelled(e),past=isPast(e);
    inner=`<h2 id="dlg-h">${esc(e.t)}</h2>
      <p style="margin:0">${chip(e.sub)} ${esc(e.k)}${e.g?' · '+esc(e.g):''}<br><span class="muted">${fmtLong(e.d)},${e.s}–${e.e}${e.l?' · '+esc(e.l):''}</span></p>
      ${x?`<div class="banner">${past?'Ist ausgefallen.':'Fällt aus.'} Der Termin zählt nicht bei Überschneidungen und Uni-Stunden.</div>`:''}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Schließen</button>
        <button class="btn ${x?'':'primary'}" data-act="uni-cancel" data-key="${d.key}" data-val="${x?0:1}">${x?'Findet doch statt':past?'Ist ausgefallen':'Fällt aus'}</button></div>`}
  }
  if(d.type==='away'){
    const from=d.date,to=d.until||d.date,n=from&&to&&to>=from?diff(from,to)+1:0;
    let cnt=0,hrs=0;if(n&&n<120){const sv=S.own;S.own={...sv};if(d.id)delete S.own[d.id];for(let i=0;i<n;i++)blocksFor(key(addDays(parse(from),i))).forEach(b=>{cnt++;hrs+=b.h});S.own=sv}
    inner=`<h2 id="dlg-h">${d.id?'Abwesenheit bearbeiten':'Abwesenheit eintragen'}</h2>
      ${!d.id&&d.fromSlot?kindSwitch('away'):''}
      <label>Was?<input type="text" id="away-title" maxlength="80" value="${esc(d.title||'')}" placeholder="z. B. Wochenende bei der Familie"></label>
      <div class="two"><label>Von<input type="date" id="away-from" value="${from||''}"></label><label>Bis (einschließlich)<input type="date" id="away-to" value="${to||''}"></label></div>
      <label class="row" style="flex-direction:row;font-weight:400;gap:8px"><input type="checkbox" id="away-pause" ${d.pause!==false?'checked':''}> Lernblöcke in dieser Zeit aussetzen</label>
      ${n?`<p class="small muted" style="margin:0">${n} ${n===1?'Tag':'Tage'}${cnt?` · betrifft ${cnt} Lernblöcke (${fmtH(hrs*60)})`:''}. Ausgesetzte Blöcke zählen weder als geplant noch als verpasst.</p>`:''}
      <div class="row between"><span class="row">${d.id?`<button class="btn danger ${d.armDel?'arm':''}" data-act="away-del">${d.armDel?'Wirklich löschen?':'Löschen'}</button>`:''}</span>
        <span class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn primary" data-act="away-save">Speichern</button></span></div>`;
  }
  if(d.type==='own'){const o=d.id?S.own[d.id]:null,rep=d.repeat||'none';
    inner=`<h2 id="dlg-h">${d.id?'Termin bearbeiten':'Neuer Termin'}</h2>
      ${!d.id&&d.fromSlot?kindSwitch('own'):''}

      <div class="three"><label>Tag<input type="date" id="own-date" value="${d.date}"></label><label>Beginn<input type="time" id="own-start" step="900" value="${d.start}"></label><label>Ende<input type="time" id="own-end" step="900" value="${d.end}"></label></div>
      <label>Ort <span class="muted small" style="font-weight:400">(optional)</span><input type="text" id="own-place" maxlength="120" value="${esc(d.place||'')}"></label>
      <div class="two"><label>Wiederholen<select id="own-repeat"><option value="none" ${rep==='none'?'selected':''}>Einmalig</option><option value="weekly" ${rep==='weekly'?'selected':''}>Jede Woche</option></select></label>

      ${(()=>{const bl=blocksFor(d.date).filter(b=>toMin(b.start)<toMin(d.end)&&toMin(b.end)>toMin(d.start));return bl.length?`<div class="banner">Überschneidet sich mit deinem Lernblock ${bl.map(b=>b.time+' '+b.subjects.map(x=>SUB[x]?.short).join('+')).join(', ')}. Verschieb den Block danach im Kalender.</div>`:''})()}
      <div class="row between">
        <span class="row">${d.id?`<button class="btn danger ${d.armDel?'arm':''}" data-act="own-del">${d.armDel?(o?.repeat==='weekly'?'Ganze Serie löschen?':'Wirklich löschen?'):(o?.repeat==='weekly'?'Serie löschen':'Löschen')}</button>`:''}${d.id&&o?.repeat==='weekly'?`<button class="btn ghost" data-act="own-skip">Nur am ${fmtShort(d.occ)} entfernen</button>`:''}</span>
        <span class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn primary" data-act="own-save">Speichern</button></span></div>`;
  }
  if(d.type==='std'){
    const rules=Object.entries(S.std).sort(([,a],[,b])=>a.weekday-b.weekday||toMin(a.start)-toMin(b.start)),tk=todayKey();
    const r=d.editId?S.std[d.editId]||{}:{weekday:dow(new Date()),start:'10:00',end:'12:00',subjects:[],label:'',from:tk,until:''};
    inner=`<h2 id="dlg-h">Standard-Lernblöcke</h2>
      <p class="small muted" style="margin:0">Sie wiederholen sich jede Woche. Einzelne Termine kannst du im Kalender trotzdem verschieben, löschen oder als ausgefallen markieren.</p>
      <div class="list">${rules.map(([id,x])=>{const ended=x.until&&x.until<tk;return `<div class="stdrow ${ended?'ended':''}" style="--c:var(--s-${x.subjects?.[0]||'en'})"><span class="grow"><b>${DS[x.weekday]} ${x.start}–${x.end}</b> ${(x.subjects||[]).map(chip).join(' ')} ${x.label?`<span class="small">${esc(x.label)}</span>`:''}<br><span class="small muted">ab ${fmtShort(x.from)}${x.until?(ended?' · beendet am ':' · bis ')+fmtShort(x.until):' · ohne Enddatum'}</span></span>
        <button class="btn ghost small" data-act="std-edit" data-id="${id}">Bearbeiten</button>${ended?'':`<button class="btn ghost small danger ${d.armEnd===id?'arm':''}" data-act="std-end" data-id="${id}">${d.armEnd===id?'Wirklich beenden?':'Beenden'}</button>`}</div>`}).join('')||'<p class="small muted" style="margin:0">Noch keine Standard-Lernblöcke.</p>'}</div>
      <h3 style="margin-top:6px">${d.editId?'Standard-Lernblock bearbeiten':'Neuer Standard-Lernblock'}</h3>
      <div class="three"><label>Wochentag<select id="std-wd">${STD_WD.map((n,i)=>`<option value="${i}" ${+r.weekday===i?'selected':''}>${n}</option>`).join('')}</select></label><label>Beginn<input type="time" id="std-start" step="900" value="${r.start}"></label><label>Ende<input type="time" id="std-end" step="900" value="${r.end}"></label></div>
      <div class="two"><label>Fach<select id="std-s1">${subjOptions(r.subjects?.[0]||defSub())}</select></label><label>Zweites Fach<select id="std-s2">${subjOptions(r.subjects?.[1]||'',true)}</select></label></div>
      <label>Was ist geplant?<input type="text" id="std-label" maxlength="160" value="${esc(r.label||'')}" placeholder="z. B. Übungsblatt der Woche rechnen"></label>
      <div class="two"><label>Ab<input type="date" id="std-from" value="${r.from||tk}"></label><label>Bis <span class="muted small" style="font-weight:400">(optional)</span><input type="date" id="std-until" value="${r.until||''}"></label></div>
      <div class="row between"><span>${d.editId?'<button class="btn ghost" data-act="std-new">Stattdessen neuen anlegen</button>':''}</span>
        <span class="row"><button class="btn ghost" data-act="close">Schließen</button><button class="btn primary" data-act="std-save">${d.editId?'Änderungen speichern':'Hinzufügen'}</button></span></div>`;
  }
  if(d.type==='block'){
    const tmp={date:d.date,start:d.start,end:d.end};const c=conflictOf(tmp);
    const gen=!d.isNew&&!d.custom;const overridden=gen&&S.ov[d.id];
    const st=!d.isNew?S.sessions.find(s=>s.blockId===d.id):null;
    inner=`<h2 id="dlg-h">${d.replaces&&d.isNew?'Ersatztermin festlegen':d.isNew?'Neuer Lernblock':'Lernblock bearbeiten'}</h2>
      ${d.isNew&&!d.replaces?kindSwitch('block'):''}
      ${d.replaces&&d.isNew?`<div class="openhint"><b>Ausgefallen:</b> ${esc(d.replacesText)}<br>Vorschlag: der nächste Samstag, an dem du nicht weg bist. Ändere Tag und Zeit, wenn es anders besser passt.</div>`:''}
      <div class="three"><label>Tag<input type="date" id="blk-date" value="${d.date}"></label><label>Beginn<input type="time" id="blk-start" step="900" value="${d.start}"></label><label>Ende<input type="time" id="blk-end" step="900" value="${d.end}"></label></div>
      <div class="two"><label>Fach<select id="blk-s1">${subjOptions(d.subjects[0]||defSub())}</select></label><label>Zweites Fach<select id="blk-s2">${subjOptions(d.subjects[1]||'',true)}</select></label></div>
      <label>Was ist geplant?<input type="text" id="blk-label" maxlength="160" value="${esc(d.label)}" placeholder="z. B. Übungsblatt 3, Aufgaben 1–4"></label>
      ${d.isNew&&!d.replaces?`<div class="two"><label class="row" style="flex-direction:row;align-items:center;gap:8px;font-weight:400"><input type="checkbox" id="blk-repeat"> Jede Woche wiederholen</label><label>Bis <span class="muted small" style="font-weight:400">(optional)</span><input type="date" id="blk-until"></label></div>`:''}
      ${(()=>{const rid=!d.isNew&&d.id&&d.id.includes('_std_')?d.id.split('_std_')[1]:null,r=rid&&S.std[rid];return r?`<div class="openhint">Teil des Standard-Lernblocks <b>jeden ${STD_WD[r.weekday]}, ${r.start}–${r.end}</b>. Änderungen hier gelten nur für diesen Tag. <button class="linkbtn" data-act="std-edit" data-id="${rid}">Ganze Serie bearbeiten</button></div>`:''})()}
      <label>Dein Vorhaben für diese Session<textarea id="blk-goal" maxlength="500" placeholder="Was willst du am Ende geschafft haben? z. B. Vorlesung 3 nacharbeiten und Übung 2 rechnen">${esc(d.goal\vert{}\vert{}'')}</textarea></label>${c?`<div class="banner">Überschneidet sich mit ${esc(uniLabel(c))} (${c.s}–${c.e}).</div>`:''}

      <div class="row between">

        <span class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn primary" data-act="save-block">${d.replaces&&d.isNew?'Ersatztermin speichern':'Speichern'}</button></span></div>`;

/* ---------- Bausteine ---------- */
const chip=id=>SUB[id]?`<span class="chip" style="--c:var(--s-${id})"><span class="dot"></span>${esc(SUB[id].short)}</span>`:'';
function goalHTML(b){
  const g=goalOf(b.id);
  if(g&&S.goalEdit!==b.id)return `<div class="goalbox"><em>Vorhaben</em>${esc(g)} <button class="linkbtn small" data-act="goal-edit" data-block="${b.id}">ändern</button></div>`;
  return `<div class="goalform"><label for="goal-${b.id}">Was willst du in dieser Session schaffen?</label>
    <textarea id="goal-${b.id}" maxlength="500" placeholder="z. B. Vorlesung 3 nacharbeiten und Übung 2, Aufgaben 1–3 rechnen">${esc(g)}</textarea>
    <div class="row"><button class="btn" data-act="save-goal" data-block="${b.id}">Vorhaben speichern</button></div></div>`}
function blockCard(b){
  const st=statusOf(b),t=S.timer&&S.timer.blockId===b.id&&!timerStale(S.timer)?timerInfo():null;
  const c=b.subjects[0]?`var(--s-${b.subjects[0]})`:'var(--muted)';
  const future=b.date>todayKey(),past=b.date<todayKey();
  const cf=conflictOf(b);const inl=S.inline&&S.inline.blockId===b.id?S.inline:null;
  const lo=b.subjects[0]&&!st&&!inl?lastOpen(b.subjects[0]):null;
  let status='';
  if(inl)status='';
  else if(st?.status==='skipped'){const r=replacementOf(b.id);status=r?`<span class="status pill-warn">Ausgefallen · Ersatz am ${DS[dow(parse(r.date))]}${fmtShort(r.date)}, ${r.start}–${r.end}</span>`:`<span class="status pill-warn">Ausgefallen · noch kein Ersatztermin</span><button class="btn" data-act="replace" data-block="${b.id}">Ersatztermin festlegen</button>`}
  else if(st)status=`<span class="status pill-ok">✓ Erledigt · ${st.minutes} min</span>`;
  else if(past)status=`<span class="status pill-bad">Offen</span>`;
  const actions=inl?'':st?(st.status!=='skipped'?`<button class="btn" data-act="edit-session" data-id="${st.id}">${st.note?'Protokoll bearbeiten':'Protokoll schreiben'}</button>`:'')+`<button class="btn ghost" data-act="undo" data-id="${st.id}">Zurücksetzen</button>`
    :future||t?'':`<button class="btn primary" data-act="timer" data-block="${b.id}" data-subj="${b.subjects[0]||defSub()}">Timer starten</button>
       <button class="btn" data-act="done" data-block="${b.id}">Session beenden und protokollieren</button>
       <button class="btn ghost" data-act="skip" data-block="${b.id}">Ausgefallen</button>`;
  return `<div class="block ${st?(st.status==='skipped'?'skipped':'done'):''}" style="--c:${c}">
    <div class="row between"><span class="time">${esc(b.time)} ·${String(b.h).replace('.',',')} h</span><span class="row">${b.subjects.map(chip).join('')}<button class="btn ghost" data-act="edit-block" data-block="${b.id}">Bearbeiten</button></span></div>
    <h3>${b.subjects.length?esc(b.subjects.map(s=>SUB[s].name).join(' / ')):'Fach offen'}</h3>
    <div class="muted">${esc(b.label)}</div>${cf?`<div class="banner">Überschneidet sich mit ${esc(uniLabel(cf))} (${cf.s}–${cf.e}). Verschieb den Block im Kalender.</div>`:''}
    ${lo?`<div class="openhint"><b>Offen vom ${fmtShort(lo.date)}:</b> ${esc(lo.open)}</div>`:''}
    ${!st&&!inl?goalHTML(b):''}
    ${t?timerHTML(t):''}
    ${status?`<div class="row">${status}</div>`:''}
    ${st&&st.status!=='skipped'&&!inl?protoHTML(st):''}
    ${inl?logFormHTML(inl,'inl'):''}
    ${actions?`<div class="row">${actions}</div>`:''}
  </div>`}

/* ---------- Heute ---------- */
function viewHeute(){
  const k=todayKey(),ph=phaseOf(k),blocks=blocksFor(k),uni=uniOn(k),mon=mondayOf(new Date()),ws=weekStats(mon);
  const ne=nextExam(k),start=diff(k,'2026-10-05');
  const extra=S.sessions.filter(s=>s.date===k&&!s.blockId&&s.status!=='skipped');
  const loose=S.timer&&!S.timer.blockId&&!timerStale(S.timer)?timerInfo():null;
  const tip=TIPS[diff('2026-01-01',k)%TIPS.length];

        <div><span class="big">${fmtH(ws.got).replace(' h','')}<span class="muted" style="font-size:1rem">/${fmtH(ws.planned)}</span></span><span class="small muted">diese Woche</span></div>

    <div class="bar" title="Wochenziel"><i style="width:${pct}%"></i></div>
    ${(()=>{const own=ownOn(k),all=[...uni,...own].sort((a,b)=>toMin(a.s)-toMin(b.s));
      return `<section class="card stack" style="gap:8px"><div class="row between"><h3>Termine heute</h3><button class="btn ghost" data-act="new-own" data-date="${k}">+ Termin</button></div>
      ${all.length?`<div class="unilist">${all.map(e=>e.own
        ?`<div class="own-row"><span class="mono muted">${e.s}–${e.e}</span><span><span class="chip ownchip">Termin</span> ${esc(e.t)}${e.l?` · <span class="muted">${esc(e.l)}</span>`:''}</span><button class="btn ghost small" data-act="own-open" data-id="${e.id}" data-date="${e.d}">Bearbeiten</button></div>`
        :`<div class="${isCancelled(e)?'cancelled':''}"><span class="mono muted">${e.s}–${e.e}</span><span>${chip(e.sub)} ${esc(e.k)} ${e.g?`<span class="muted small">(${esc(e.g)})</span>`:''} · <span class="muted">${esc(e.l)}</span>${isCancelled(e)?' <b class="pill-warn small">fällt aus</b>':''}</span>

        :`<div class="muted small">${S.uni.length?'Heute keine Termine.':'Noch kein Stundenplan importiert.'}</div>`}</section>`})()}
    ${(()=>{const mk=key(mon),w=weekOf(mk),d=dow(new Date());let h='';
      if(w.goals)h+=`<div class="goalbox"><em>Wochenziele</em>${esc(w.goals)}</div>`;
      else h+=`<div class="card row between"><span><b>Plane deine Woche.</b> <span class="muted">Leg Wochenziele und für jeden Lernblock ein Vorhaben fest.</span></span><button class="btn primary" data-act="go-week">Woche planen</button></div>`;
      if(d>=5&&!w.reviewedAt)h+=`<div class="card row between"><span><b>Zeit für deinen Wochenrückblick.</b> <span class="muted">Wo stehst du, was lief gut, was machst du anders?</span></span><button class="btn primary" data-act="go-review">Rückblick schreiben</button></div>`;
      return h})()}
    ${(()=>{const due=sortTodos(S.todos.filter(t=>!t.done&&t.due&&t.due<=todayKey()));return due.length?`<section class="card stack" style="gap:6px"><div class="row between"><h3>Fällige To-dos</h3><button class="btn ghost" data-act="go-todos">Alle To-dos</button></div><div class="list">${due.map(todoRow).join('')}</div></section>`:''})()}
    ${dueChores.length ? `<section class="card stack" style="gap:6px"><div class="row between"><h3>Haushalt (fällig)</h3><button class="btn ghost" data-act="go-chores">Zum Haushalt</button></div><div class="list">${dueChores.map(c=>`<div class="choreitem"><button class="btn ghost small" data-act="chore-done" data-id="${c.id}">✓</button><label class="grow"><span class="ttxt"><b>${esc(c.text)}</b></span>${c.room?`<span class="chip">${esc(c.room)}</span>`:''}</label></div>`).join('')}</div></section>` : ''}
    ${(()=>{const aw=awayOn(k);if(!aw.length)return '';const a=aw[0],last=a.until||a.date;
      return `<div class="card row between awaycard"><span><b>Du bist weg${a.title?': '+esc(a.title):''}</b> <span class="muted">${last===k?'heute noch':'bis '+DAYS[dow(parse(last))]+', '+fmtShort(last)}${a.pause!==false?' · keine Lernblöcke':''}</span></span><button class="btn ghost" data-act="away-open" data-id="${a.id}">Bearbeiten</button></div>`})()}
    <section class="stack">
