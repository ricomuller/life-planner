    if(b&&!goalOf(id)){const ta=document.getElementById('goal-'+id),v=(ta?.value||'').trim();
      if(!v){toast('Halte zuerst kurz fest, was du in dieser Session schaffen willst.');ta?.focus();return}
      saveGoal(id,b.date,v)}
    S.goalEdit=null;startTimer(id,a.dataset.subj);return}
  if(act==='save-goal'){const id=a.dataset.block,b=findBlock(id),v=(document.getElementById('goal-'+id)?.value||'').trim();
    if(!v){toast('Schreib kurz auf, was du schaffen willst.');return}if(b){S.goalEdit=null;saveGoal(id,b.date,v);toast('Vorhaben gespeichert')}return}
  if(act==='goal-edit'){S.goalEdit=a.dataset.block;render();setTimeout(()=>document.getElementById('goal-'+a.dataset.block)?.focus(),20);return}
  if(act==='replace'){const b=findBlock(a.dataset.block);if(b)openReplacement(b);return}
  if(act==='go-week'||act==='go-review'){S.tab='woche';S.weekOff=0;ls.set('lt-tab','woche');render();
    if(act==='go-review')setTimeout(()=>document.getElementById('review')?.scrollIntoView({behavior:'smooth'}),30);else window.scrollTo(0,0);return}
  if(act==='save-wg'){const mk=a.dataset.mon;saveWeek(mk,{goals:(document.getElementById('wg-'+mk)?.value||'').trim()});toast('Wochenziele gespeichert');return}
  if(act==='rate'){saveWeek(a.dataset.mon,{rating:+a.dataset.n});return}
  if(act==='save-review'){const mk=a.dataset.mon,g=n=>(document.getElementById(`rf-${n}-${mk}`)?.value||'').trim();
    saveWeek(mk,{stand:g('stand'),gut:g('gut'),anders:g('anders'),reviewedAt:todayKey()});toast('Rückblick gespeichert');return}
  if(act==='stop'){stopTimer();return}
  if(act==='cancel-timer'){S.timer=null;ls.set('lt-timer',null);render();return}
  if(act==='done'){const b=findBlock(a.dataset.block);if(b)openLog({blockId:b.id,date:b.date,subject:b.subjects[0]||defSub(),minutes:b.h*60});return}
  if(act==='skip'){const b=findBlock(a.dataset.block);if(b)skipBlock(b);return}
  if(act==='undo'){delSession(a.dataset.id);return}
  if(act==='extend'){extendTimer(+a.dataset.min);return}
  if(act==='pause'){pauseTimer();return}
  if(act==='resume'){resumeTimer();return}
  if(act==='mini-on'){S.mini=true;try{location.hash='mini'}catch{}render();window.scrollTo(0,0);return}
  if(act==='mini-off'){S.mini=false;try{location.hash=''}catch{}render();return}
  if(act==='mini-stop'){S.mini=false;try{location.hash=''}catch{}stopTimer();return}
  if(act==='mini-start'){S.mini=false;try{location.hash=''}catch{}S.tab='heute';render();document.querySelector('[data-act="start-free"]')?.click();return}
  if(act==='pip'){openPip();return}
  if(act==='start-free'){if(needSubject())return;if(S.timer){toast('Es läuft noch ein Timer. Beende oder verwirf ihn zuerst.');window.scrollTo(0,0);return}
    const nb=blocksFor(todayKey()).find(b=>!statusOf(b)&&toMin(b.end)>new Date().getHours()*60+new Date().getMinutes());
    openDialog({type:'start',subject:nb?.subjects[0]||defSub()});setTimeout(()=>document.getElementById('st-goal')?.focus(),30);return}
  if(act==='start-go'){const subject=document.getElementById('st-subj').value,goal=document.getElementById('st-goal').value.trim();
    if(!goal){toast('Halte kurz fest, was du in dieser Session schaffen willst.');document.getElementById('st-goal').focus();return}
    S.dialog=null;S.timer={start:Date.now(),blockId:null,subject,goal};ls.set('lt-timer',JSON.stringify(S.timer));
    S.tab='heute';ls.set('lt-tab','heute');render();window.scrollTo(0,0);toast('Los geht’s: 25 Minuten Fokus');return}
  if(act==='extra'){if(needSubject())return;const k=todayKey();const b=blocksFor(k)[0];openLog({blockId:null,date:k,subject:b?.subjects[0]||defSub(),minutes:50});return}
  if(act==='edit-session'){const s=S.sessions.find(x=>x.id===a.dataset.id);if(s)openLog({sessionId:s.id,blockId:s.blockId,date:s.date,subject:s.subject,minutes:s.minutes,note:s.note,open:s.open,goal:s.goal,goalMet:s.goalMet,rating:s.rating});return}
  if(act==='edit-block'){const b=findBlock(a.dataset.block);if(b)openBlock(b,false);return}
  if(act==='std-open'||act==='std-new'){if(needSubject())return;openDialog({type:'std'});return}
  if(act==='std-edit'){openDialog({type:'std',editId:a.dataset.id});return}
  if(act==='std-end'){const d=S.dialog;if(d.armEnd!==a.dataset.id){d.armEnd=a.dataset.id;render();return}endStd(a.dataset.id);d.armEnd=null;render();toast('Standard-Lernblock beendet. Vergangene Termine und Protokolle bleiben.');return}
  if(act==='std-save'){const d=S.dialog,g=id=>document.getElementById(id).value,start=g('std-start'),end=g('std-end'),from=g('std-from'),until=g('std-until')||null;
    if(!start||!end||!from){toast('Trag Beginn, Ende und „Ab“ ein.');return}
    if(toMin(end)<=toMin(start)){toast('Das Ende muss nach dem Beginn liegen.');return}
    if(until&&until<from){toast('„Bis“ muss nach „Ab“ liegen.');return}
    const wd=+g('std-wd'),rid=d.editId||'s'+Date.now().toString(36);
    saveStd(rid,{weekday:wd,start,end,subjects:[...new Set([g('std-s1'),g('std-s2')].filter(Boolean))],label:g('std-label').trim(),from,until});
    openDialog({type:'std'});toast(d.editId?'Gespeichert':`Angelegt: jeden ${STD_WD[wd]}, ${start}–${end}`);return}
  if(act==='new-block'){if(needSubject())return;const k=key(addDays(mondayOf(new Date()),S.weekOff*7+Math.min(5,S.weekOff?0:dow(new Date()))));openBlock({date:k,start:'10:00',end:'11:00',subjects:[defSub()].filter(Boolean),label:''},true);return}
  if(act==='save-log'){const p=a.dataset.p||'dlg',d=p==='inl'?S.inline:S.dialog;if(!d)return;
    const $=n=>document.getElementById(`${p}-${n}`),m=Math.round(+$('min').value);
    if(!(m>0)){toast('Trag die Minuten ein, die du gelernt hast.');return}
    const subject=$('subj').value,note=$('note').value.trim(),open=$('open').value.trim();
    const form=a.closest('.logform');
    const ticked=[...form.querySelectorAll('[data-tp]')].filter(x=>x.checked).map(x=>x.dataset.tp);
    const all=kindsFor(subject).flatMap(k=>itemsFor(subject,k)),byKey=Object.fromEntries(all.map(i=>[i.key,i]));
    const wkKeys=[...new Set([...[...form.querySelectorAll('[data-wk]')].filter(x=>x.checked).map(x=>x.dataset.wk),...detectWorked(subject,note).map(i=>i.key)])].filter(k=>byKey[k]);
    const existing=d.sessionId||(d.blockId&&S.sessions.find(s=>s.blockId===d.blockId&&s.status!=='skipped')?.id);
    const prev=existing?(S.sessions.find(s=>s.id===existing)?.worked||[]):[];
    const worked=[...new Set([...prev,...wkKeys.map(k=>byKey[k].title)])];
    const goal=d.goal||(d.blockId?goalOf(d.blockId):''),goalMet=form.querySelector(`input[name="${p}-gm"]:checked`)?.value||'';
    const rating=+(form.querySelector(`input[name="${p}-sat"]:checked`)?.value||0);
    if(existing)updateSession(existing,{subject,minutes:m,note,open,worked,goal,goalMet,rating});
    else addSession({date:d.date,blockId:d.blockId||null,subject,minutes:m,note,open,worked,goal,goalMet,rating,status:'done'});
    markWorked(subject,wkKeys);
    if(ticked.length)saveSubject(subject,{topics:(S.subjects[subject]?.topics||[]).map(t=>({...t,done:t.done||ticked.includes(t.id)}))});
    if(p==='inl')S.inline=null;else S.dialog=null;
    render();toast(wkKeys.length?`Protokoll gespeichert · ✓ ${wkKeys.map(k=>byKey[k].title).join(', ')}`:note?'Protokoll gespeichert':'Gespeichert. Das Protokoll kannst du später noch ergänzen.');return}
  if(act==='tf'){S.todoFilter=a.dataset.f;render();return}
  if(act==='todo-edit'){S.todoEdit=a.dataset.id;render();setTimeout(()=>{const i=document.getElementById('te-text-'+a.dataset.id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},20);return}
  if(act==='todo-cancel'){S.todoEdit=null;render();return}
  if(act==='todo-save'){const id=a.dataset.id,g=n=>document.getElementById(`te-${n}-${id}`),text=g('text').value.trim();
    if(!text){toast('Das To-do braucht einen Text. Zum Löschen tipp auf ×.');return}
    S.todoEdit=null;saveTodo(id,{text,cat:g('cat').value,due:g('due').value||null});toast('To-do geändert');return}
  if(act==='td-showdone'){S.showDone=!S.showDone;render();return}
  if(act==='go-todos'){S.tab='todos';ls.set('lt-tab','todos');render();window.scrollTo(0,0);return}
  if(act==='fsel'){S.fachSel=a.dataset.s;S.fachTab='ueber';ls.set('lt-fach',S.fachSel);render();window.scrollTo(0,0);return}
  if(act==='ftab'){S.fachTab=a.dataset.k;render();return}
  if(act==='work-next'){const nx=itemsFor(a.dataset.s,a.dataset.k).find(i=>!i.done);if(nx){markWorked(a.dataset.s,[nx.key]);toast(`✓ ${nx.title}`)}return}
  if(act==='ftab-open'){S.fachSel=a.dataset.s;S.fachTab=a.dataset.k;ls.set('lt-fach',S.fachSel);render();window.scrollTo(0,0);return}
  if(act==='del-item'){const s=a.dataset.s;saveSubject(s,{items:(S.subjects[s]?.items||[]).filter(i=>i.id!==a.dataset.id).map(i=>({...i}))});return}
  if(act==='log-cancel'){if(a.dataset.p==='inl')S.inline=null;else S.dialog=null;render();return}
  if(act==='show-in-cal'){S.weekOff=weekOffOf(a.dataset.date);S.tab='kalender';ls.set('lt-tab',S.tab);render();window.scrollTo(0,0);return}
  if(act==='save-block'){const d=S.dialog,date=document.getElementById('blk-date').value,start=document.getElementById('blk-start').value,end=document.getElementById('blk-end').value;
    if(!date||!start||!end){toast('Trag Tag, Beginn und Ende ein.');return}
    if(toMin(end)<=toMin(start)){toast('Das Ende muss nach dem Beginn liegen.');return}
    const s1=document.getElementById('blk-s1').value,s2=document.getElementById('blk-s2').value;
    if(d.isNew&&!d.replaces&&document.getElementById('blk-repeat')?.checked){
      const rid='s'+Date.now().toString(36),until=document.getElementById('blk-until').value||null;
      if(until&&until<date){toast('„Bis“ muss nach dem ersten Termin liegen.');return}
      saveStd(rid,{weekday:dow(parse(date)),start,end,subjects:[...new Set([s1,s2].filter(Boolean))],label:document.getElementById('blk-label').value.trim(),from:date,until});
      saveGoal(date+'_std_'+rid,date,document.getElementById('blk-goal').value);
      S.dialog=null;render();toast(`Standard-Lernblock angelegt: jeden ${STD_WD[dow(parse(date))]}, ${start}–${end}`);return}
    const nid=d.id||'c'+Date.now().toString(36);
    saveBlock({id:nid,date,start,end,subjects:[...new Set([s1,s2].filter(Boolean))],label:document.getElementById('blk-label').value.trim(),custom:d.custom,replaces:d.replaces||(S.ov[nid]?.replaces)||null});
    saveGoal(nid,date,document.getElementById('blk-goal').value);
    const wasRepl=d.replaces&&d.isNew;S.dialog=null;render();toast(wasRepl?`Ersatztermin steht: ${DS[dow(parse(date))]} ${fmtShort(date)}, ${start}–${end}`:'Lernblock gespeichert');return}
  if(act==='blk-del'){const d=S.dialog;if(!d.armDel){d.armDel=true;render();return}
    if(d.custom)removeOverride(d.id);else{const b=findBlock(d.id);saveBlock({...(b||d),id:d.id,deleted:true})}
    S.dialog=null;render();toast('Lernblock gelöscht');return}
  if(act==='blk-reset'){removeOverride(S.dialog.id);S.dialog=null;render();toast('Wieder wie im Plan');return}
  if(act==='blk-done'){const b=findBlock(S.dialog.id);if(b)openLog({blockId:b.id,date:b.date,subject:b.subjects[0]||defSub(),minutes:b.h*60});return}
  if(act==='blk-skip'){const b=findBlock(S.dialog.id);S.dialog=null;if(b)skipBlock(b);else render();return}
  if(act==='wk'){S.weekOff=a.dataset.d==='0'?0:S.weekOff+ +a.dataset.d;render();return}
  if(act==='pf'){S.protoFilter=a.dataset.f;render();return}
  if(act==='del-topic'){const s=a.dataset.s;saveSubject(s,{topics:(S.subjects[s]?.topics||[]).filter(t=>t.id!==a.dataset.t)});return}
  if(act==='del-todo'){delTodo(a.dataset.id);return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='away-from'||e.target.id==='away-to'){const d=S.dialog;if(d?.type==='away'){d.date=document.getElementById('away-from').value;d.until=document.getElementById('away-to').value||d.date;d.title=document.getElementById('away-title').value;d.pause=document.getElementById('away-pause').checked;render()}return}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='shop-toggle'){const item=S.shopping.find(s=>s.id===a.dataset.id);if(item)saveShop(item.id,{bought:a.checked});return}
  if(a.dataset.act==='log-subj'){const d=a.dataset.p==='inl'?S.inline:S.dialog;if(d){d.subject=a.value;render()}return}
  if(a.dataset.act==='work'){markWorked(a.dataset.s,[a.dataset.key],a.checked);return}
  if(a.dataset.act==='goal-input'){saveGoal(a.dataset.block,a.dataset.date,a.value);return}
  if(a.dataset.act==='count'){setCount(a.dataset.s,a.dataset.k,a.value);return}
  if(a.dataset.act==='topic'){const s=a.dataset.s;saveSubject(s,{topics:(S.subjects[s]?.topics||[]).map(t=>t.id===a.dataset.t?{...t,done:a.checked}:{...t})})}
  if(a.dataset.act==='exam'){saveSubject(a.dataset.s,{examDate:a.value||null})}
  if(a.dataset.act==='todo'){saveTodo(a.dataset.id,{done:a.checked,doneAt:a.checked?Date.now():null})}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const inp=f.querySelector('input[type=text]'),v=inp.value.trim();if(!v)return;
  if(f.dataset.form==='topic'){inp.value='';const s=f.dataset.s;saveSubject(s,{topics:[...(S.subjects[s]?.topics||[]).map(t=>({...t})),{id:Date.now().toString(36),t:v,done:false}]})}
  if(f.dataset.form==='item'){inp.value='';const s=f.dataset.s;saveSubject(s,{items:[...(S.subjects[s]?.items||[]).map(i=>({...i})),{id:Date.now().toString(36),k:f.dataset.k,t:v,done:false}]})}
  if(f.dataset.form==='todo'){inp.value='';saveTodo(null,{text:v,done:false,order:Date.now()})}
  if(f.dataset.form==='todo2'){const cat=document.getElementById('todo-cat').value,due=document.getElementById('todo-due').value||null;S.todoLastCat=cat;
    saveTodo(null,{text:v,done:false,order:Date.now(),cat,due});document.getElementById('todo-due').value='';toast('To-do hinzugefügt')}
  if(f.dataset.form==='chore'){const freq=document.getElementById('chore-freq').value,room=document.getElementById('chore-room').value.trim();
    saveChore(null,{text:v,freq,room,lastDone:null,order:Date.now()});inp.value='';document.getElementById('chore-room').value='';toast('Haushaltsaufgabe hinzugefügt')}
  if(f.dataset.form==='shop'){const qty=document.getElementById('shop-qty').value.trim(),cat=document.getElementById('shop-cat').value;
    saveShop(null,{text:v,qty,cat,bought:false,order:Date.now()});inp.value='';document.getElementById('shop-qty').value='';toast('Zum Einkaufszettel hinzugefügt')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.dialog){S.dialog=null;render();return}
  if(e.key==='Escape'&&S.todoEdit){S.todoEdit=null;render();return}
  if(e.key==='Enter'&&e.target.id?.startsWith('te-text-')){e.preventDefault();e.target.closest('.todo')?.querySelector('[data-act="todo-save"]')?.click();return}
  if(e.key==='Enter'&&e.target.matches?.('.ev.uni,.ev.own')){e.target.click();return}
  if(e.key==='Enter'&&e.target.matches?.('.ev.learn')){const b=findBlock(e.target.dataset.bid);if(b)openBlock(b,false);return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&/^(dlg|blk|inl)-/.test(e.target.id)){e.preventDefault();e.target.closest('.dialog,.logform')?.querySelector('[data-act="save-log"],[data-act="save-block"]')?.click()}});

render();
setInterval(()=>{if(!S.dialog&&!S.drag&&!document.activeElement?.matches('input,select,textarea'))render()},60000);

/* ---------- Datenbank ---------- */
(window.claude?.use?window.claude.use('db'):Promise.resolve(null)).then(db=>{
  if(!db){S.dbState='off';render();return}
  S.db=db;S.dbState='on';
  const fail=()=>{S.dbState='off';render()};
  db.collection('sessions').onSnapshot(s=>{S.sessions=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('subjects').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.subjects=m;render()},fail);
  db.collection('todos').onSnapshot(s=>{S.todos=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('chores').onSnapshot(s=>{S.chores=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('shopping').onSnapshot(s=>{S.shopping=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection('subj').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data()});setSubjects(m);render()},fail);
  db.collection('std').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data()});S.std=m;render()},fail);
  db.collection('goals').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.goals=m;render()},fail);
  db.collection('weeks').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.weeks=m;render()},fail);
  db.collection('blocks').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});S.ov=m;indexOv();render()},fail);
  db.doc('uni/cancelled').onSnapshot(s=>{S.uniCancel=s.exists?{...(s.data().keys||{})}:{};render()},fail);
  db.collection('events').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data()});S.own=m;render()},fail);
  db.doc('uni/timetable').onSnapshot(s=>{if(s.exists){const d=s.data();setUni(d.events||[]);S.uniMeta={source:d.source,importedAt:d.importedAt}}else{setUni([]);S.uniMeta=null}render()},fail);
}).catch(()=>{S.dbState='off';render()});
</script>
</body>
</html>
