      ${loose?`<div class="block" style="--c:var(--s-${S.timer.subject})"><div class="row between"><span class="time">Freie Lernsession</span>${chip(S.timer.subject)}</div><h3>${esc(SUB[S.timer.subject]?.name||'')}</h3>${S.timer.goal?`<div class="goalbox"><em>Vorhaben</em>${esc(S.timer.goal)}</div>`:''}${timerHTML(loose)}</div>`:''}
    </section>
    ${extra.length?`<section class="card"><h3 style="margin-bottom:6px">Zusätzlich heute</h3><div class="list">${extra.map(s=>`<div>${chip(s.subject)}<span class="grow small">${s.minutes} min${s.note?' · '+esc(s.note):''}</span><button class="btn ghost" data-act="edit-session" data-id="${s.id}">Bearbeiten</button></div>`).join('')}</div></section>`:''}
    <p class="muted small" style="margin:0">Tipp: ${esc(tip)}</p>
  </div>`}

/* ---------- Kalender ---------- */
const CAL_START=7*60,CAL_END=22*60,PX=0.8;
function layout(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);let cl=[],end=-1;const groups=[];
  items.forEach(it=>{if(cl.length&&it.s>=end){groups.push(cl);cl=[];end=-1}cl.push(it);end=Math.max(end,it.e)});if(cl.length)groups.push(cl);
  groups.forEach(g=>{const lanes=[];g.forEach(it=>{let i=lanes.findIndex(e=>e<=it.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=it.e;it.lane=i});g.forEach(it=>it.lanes=lanes.length)});
  return items}
function viewKalender(){
  const mon=addDays(mondayOf(new Date()),S.weekOff*7),sun=addDays(mon,6),ws=weekStats(mon),tk=todayKey(),now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  const pct=Math.min(100,ws.planned?ws.got/ws.planned*100:0),H=(CAL_END-CAL_START)*PX;
  let head='<div class="hd"></div>',cols='';
  let gut=`<div class="gut" style="height:${H}px">`;for(let h=8;h<22;h++)gut+=`<span style="top:${(h*60-CAL_START)*PX}px">${pad(h)}</span>`;gut+='</div>';
  for(let i=0;i<7;i++){const k=key(addDays(mon,i)),m=minutesOn(k);
    const aw=awayOn(k);
    head+=`<div class="hd ${k===tk?'today':''}"><b>${DS[i]} ${parse(k).getDate()}.${parse(k).getMonth()+1}.</b><span class="small ${m?'pill-ok':'muted'} mono">${m?fmtH(m):FREE_DAYS.includes(k)?'frei':' '}</span>${aw.map(a=>`<button class="awaytag" data-act="away-open" data-id="${a.id}" title="${esc(a.title||'Abwesend')}">Weg: ${esc(a.title||'abwesend')}</button>`).join('')}</div>`;
    const items=layout([...uniOn(k).map(e=>({type:'uni',s:toMin(e.s),e:toMin(e.e),ev:e})),...ownOn(k).map(e=>({type:'own',s:toMin(e.s),e:toMin(e.e),ev:e})),...blocksFor(k).map(b=>({type:'learn',s:toMin(b.start),e:toMin(b.end),b}))]);
    let html='';
    items.forEach(it=>{const top=(Math.max(it.s,CAL_START)-CAL_START)*PX,h=Math.max(16,(Math.min(it.e,CAL_END)-Math.max(it.s,CAL_START))*PX);
      const pos=`top:${top}px;height:${h}px;left:calc(${it.lane}*100%/${it.lanes} + 2px);width:calc(100\%/${it.lanes} - 4px)`;
      if(it.type==='uni'){const e=it.ev,x=isCancelled(e);html+=`<div class="ev uni ${x?'cancelled':''}" role="button" tabindex="0" data-act="uni-open" data-key="${evKey(e)}" data-date="${e.d}" style="${pos};--c:var(--s-${e.sub\vert{}\vert{}'en'})" title="${esc(`${e.s}–${e.e} ${e.t} (${e.k}) ${e.g} · ${e.l}${x?' · fällt aus':''}`)}"><span class="t">${e.s}–${e.e}</span><b>${esc(uniLabel(e))}</b><span class="loc">${x?'fällt aus':esc(e.l)}</span></div>`}
      else if(it.type==='own'){const e=it.ev;html+=`<div class="ev own" role="button" tabindex="0" data-act="own-open" data-id="${e.id}" data-date="${e.d}" style="${pos}" title="${esc(`${e.s}–${e.e} ${e.t}${e.l?' · '+e.l:''}`)}"><span class="t">${e.s}–${e.e}</span><b>${esc(e.t)}</b><span class="loc">${esc(e.l)}</span></div>`}
      else{const b=it.b,st=statusOf(b),cf=conflictOf(b);
        const mark=st&&st.status!=='skipped'?'✓ ':'',names=esc(b.subjects.map(s=>SUB[s]?.short).join(' + '));
        const tip=st&&st.status!=='skipped'?`Protokoll: ${st.note\vert{}\vert{}'noch leer'}${st.open?'\nOffen: '+st.open:''}`:b.label;
        html+=`<div class="ev learn ${st?(st.status==='skipped'?'skipped':'done'):''}${cf?'conflict':''}" tabindex="0" role="button" aria-label="Lernblock ${esc(b.time)}${esc(b.subjects.map(s=>SUB[s]?.short).join(' und '))}, verschieben oder bearbeiten" data-bid="${b.id}" style="${pos};--c:var(--s-${b.subjects[0]||'en'})" title="${esc(tip)}">${it.e-it.s<40?`<b>${mark}${names} ${b.start}</b>`:`<span class="t">${b.time}</span><b>${mark}${names||'Lernen'}</b><span class="loc">${esc(st&&st.status!=='skipped'&&st.note?st.note:b.label)}</span>`}<div class="res" aria-hidden="true"></div></div>`}});
    if(k===tk&&nowM>=CAL_START&&nowM<=CAL_END)html+=`<div class="nowline" style="top:${(nowM-CAL_START)*PX}px"></div>`;
    cols+=`<div class="daycol ${k===tk?'today':''} ${i===6?'sun':''}${aw.length?'away':''}" data-date="${k}" data-i="${i}" style="height:${H}px">${html}</div>`}

  const cleanUrl = S.calUrl ? (S.calUrl.match(/src=["']([^"']+)["']/i)?.[1] || S.calUrl).replace(/&amp;/g, '&') : '';

  return `<div class="stack">
    <div class="row between"><div><span class="label">KW ${isoWeek(mon)} · Kalender</span><h1>${fmtShort(key(mon))} –${fmtShort(key(sun))}</h1></div>
      <div class="row"><button class="btn" data-act="wk" data-d="-1" aria-label="Vorige Woche">←</button><button class="btn" data-act="wk" data-d="0">Diese Woche</button><button class="btn" data-act="wk" data-d="1" aria-label="Nächste Woche">→</button></div></div>
    <div class="card stack" style="gap:10px">
      <div class="row between"><span><span class="label">Lernen</span> <b class="mono">${fmtH(ws.got)} von${fmtH(ws.planned)} geplant</b></span><span class="small muted">${skippedText(ws)}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
      ${(()=>{const u=uniHours(key(mon),key(sun)),nx=S.uni.filter(e=>e.d>=key(mon)&&e.d<=key(sun)&&isCancelled(e)).length;return u.total?`<div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><span><span class="label">Uni</span> <b class="mono">${fmtH(u.total*60)}</b></span><span class="kinds">${KINDS.filter(k=>u[k]).map(k=>`<span>${k} <b>${numH(u[k])} h</b></span>`).join('')}${nx?`<span class="pill-warn">${nx} fällt aus</span>`:''}</span></div>
      <div class="small muted">Zusammen mit dem Lernplan: <b class="mono" style="color:var(--ink)">${fmtH(u.total*60+ws.planned)}</b> in dieser Woche.</div>`:`<div class="small muted" style="border-top:1px solid var(--line);padding-top:10px">Diese Woche keine Uni-Termine.</div>`})()}
    </div>
    <div class="row between"><div class="legend"><span><i style="background:repeating-linear-gradient(135deg,var(--uni) 0 3px,var(--uni2) 3px 6px);border:1px solid var(--line)"></i>Uni</span><span><i style="background:color-mix(in srgb,var(--accent) 20%,var(--surface));border-left:3px solid var(--accent)"></i>Lernblock</span><span><i style="background:color-mix(in srgb,var(--ok) 20%,var(--surface));border:1px solid var(--ok)"></i>erledigt</span><span><i style="outline:2px dashed var(--bad);outline-offset:-2px"></i>Überschneidung</span><span><i style="background:color-mix(in srgb,var(--own) 18%,var(--surface));border-left:3px solid var(--own)"></i>eigener Termin</span><span><i style="background:var(--uni);opacity:.5;border:1px dashed var(--muted)"></i>fällt aus</span><span><i style="background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--own) 25%,transparent) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>abwesend</span></div>
      <span class="row"><button class="btn" data-act="std-open">Standard-Lernblöcke</button><button class="btn" data-act="new-block">+ Lernblock</button><button class="btn" data-act="new-own">+ Termin</button><button class="btn" data-act="new-away">+ Abwesend</button>${icsBtn('Stundenplan importieren')}</span></div>
    <div class="calwrap"><div class="cal">${head}${gut}${cols}</div></div>
    
    <div class="card stack" style="margin-top: 16px;">
      <div class="row between" style="align-items:flex-end;">
        <h3>Externer Kalender</h3>
        <div class="row" style="flex-wrap:nowrap; flex:1; max-width:400px; justify-content:flex-end;"><input type="text" id="calurl-input" placeholder="Link oder iframe-Code einfügen" value="${esc(S.calUrl)}" style="width: 100%;"><button class="btn" data-act="save-calurl">Speichern</button></div>
      </div>
      ${cleanUrl ? `<iframe src="${esc(cleanUrl)}" style="border: 0; border-radius: 8px; width: 100%; height: 500px;" frameborder="0" scrolling="no"></iframe>` : `<p class="small muted" style="margin:0;">Füge deinen öffentlichen Kalender-Link oder Embed-Code ein, um ihn hier anzuzeigen. Er wird für deine zukünftigen Besuche gespeichert.</p>`}
    </div>

    <p class="small muted" style="margin:0">Lernblöcke ziehen zum Verschieben, am unteren Rand ziehen zum Verlängern oder Kürzen, antippen zum Bearbeiten. Auf eine freie Stelle klicken legt einen neuen Block an.${S.uniMeta?` Stundenplan: ${esc(S.uniMeta.source||'')}, geladen am ${fmtShort(S.uniMeta.importedAt)}.`:''}</p>
  </div>`}

/* ---------- Woche: planen und zurückblicken ---------- */
function viewWoche(){
  const mon=addDays(mondayOf(new Date()),S.weekOff*7),mk=key(mon),sun=key(addDays(mon,6)),w=weekOf(mk),prev=weekOf(key(addDays(mon,-7))),ws=weekStats(mon),tk=todayKey();
  const days=[...Array(7)].map((_,i)=>key(addDays(mon,i)));
  const blocks=days.flatMap(k=>blocksFor(k)),planned=blocks.filter(b=>goalOf(b.id)).length;
  const sess=S.sessions.filter(s=>s.date>=mk&&s.date<=sun),dn=sess.filter(s=>s.status!=='skipped');
  const doneBlocks=blocks.filter(b=>{const x=statusOf(b);return x&&x.status!=='skipped'}).length,skipped=blocks.filter(b=>statusOf(b)?.status==='skipped').length;
  
  const rows=days.map(k=>{const bl=blocksFor(k);if(!bl.length)return '';
    return `<div class="planday"><div class="small"><b>${DS[dow(parse(k))]} ${fmtShort(k)}</b>${k===tk?' <span class="chip">heute</span>':''}</div><div class="stack" style="gap:6px">${bl.map(b=>{const st=statusOf(b);
      const res=st?.status==='skipped'?`<span class="small pill-warn">ausgefallen</span>`:st?`<span class="small pill-ok">✓ erledigt</span>`:'';
      return `<div class="planrow" style="--c:var(--s-${b.subjects[0]||'en'})"><span class="mono small muted">${b.start}</span><span class="row" style="gap:4px">${b.subjects.map(chip).join('')}</span>
        <input type="text" id="gl-${b.id}" data-act="goal-input" data-block="${b.id}" data-date="${b.date}" maxlength="500" value="${esc(goalOf(b.id))}" placeholder="${esc(b.label\vert{}\vert{}'Vorhaben für diese Session')}" aria-label="Vorhaben ${DS[dow(parse(k))]} ${b.time}">${res}</div>`}).join('')}</div></div>`}).join('');
  
  return `<div class="stack">
    <div class="row between"><div><span class="label">KW ${isoWeek(mon)} · Planung und Rückblick</span><h1>Woche ${fmtShort(mk)} – ${fmtShort(sun)}</h1></div>
      <div class="row"><button class="btn" data-act="wk" data-d="-1" aria-label="Vorige Woche">←</button><button class="btn" data-act="wk" data-d="0">Diese Woche</button><button class="btn" data-act="wk" data-d="1" aria-label="Nächste Woche">→</button></div></div>
    
    <div class="stats">
      <div><span class="label">Geplant</span><b>${planned}</b><span class="small muted">Lernblöcke</span></div>
      <div><span class="label">Erledigt</span><b style="color:var(--ok)">${doneBlocks}</b><span class="small muted">Lernblöcke</span></div>
      <div><span class="label">Ausgefallen</span><b class="pill-warn">${skipped}</b><span class="small muted">Lernblöcke</span></div>
    </div>
    
    <div class="card stack">
      <h3>Wochenplanung</h3>
      <textarea id="week-goals" rows="4" placeholder="Was sind deine wichtigsten Ziele für diese Woche?">${esc(w.goals||'')}</textarea>
      <div class="row"><button class="btn" data-act="save-week-goals" data-mon="${mk}">Ziele speichern</button></div>
    </div>
    
    <div class="stack" style="gap:16px; margin-top:8px">${rows}</div>

}

          <div class="stack" style="margin-top:12px">
            <p class="muted small">Hier kannst du Notizen, To-dos oder Zusammenfassungen für die <b>${tab === 'V' ? 'Vorlesung' : tab === 'Ü' ? 'Übung' : tab === 'P' ? 'Praktika' : 'Seminare'}</b> ablegen.</p>
            <textarea id="note-${s.id}-${tab}" rows="8" placeholder="Freitext-Notizen...">${esc((s.itemNotes||{})[tab]||'')}</textarea>
            <div class="row"><button class="btn primary" data-act="save-note" data-id="${s.id}" data-tab="${tab}">Speichern</button></div>
          </div>
        `}
      </div>
    `}
  </div>`;
}

/* ---------- To-dos & Alltag ---------- */
function viewTodos() {
  return `<div class="stack">
    <h2>To-dos & Haushalt</h2>
    <div class="grid2">
      <div class="card stack">
        <h3>To-dos</h3>
        <div class="list">${S.todos.map(t=>`<div class="todo ${t.done?'done':''}"><input type="checkbox" data-act="todo-toggle" data-id="${t.id}" ${t.done?'checked':''}><span class="grow ttxt">${esc(t.text)}</span><button class="xbtn" data-act="todo-del" data-id="${t.id}">×</button></div>`).join('')}</div>
        <div class="todoform" style="margin-top:8px; display:flex; gap:8px"><input type="text" id="new-todo" placeholder="Was ist zu tun?" class="grow"><button class="btn" data-act="todo-add">Add</button></div>
      </div>
      <div class="card stack">
        <h3>Einkaufen</h3>
        <div class="list">${S.shopping.map(t=>`<div class="shopitem ${t.bought?'bought':''}"><input type="checkbox" data-act="shop-toggle" data-id="${t.id}" ${t.bought?'checked':''}><span class="grow stxt">${esc(t.text)}</span><button class="xbtn" data-act="shop-del" data-id="${t.id}">×</button></div>`).join('')}</div>
        <div class="todoform" style="margin-top:8px; display:flex; gap:8px"><input type="text" id="new-shop" placeholder="Was brauchst du?" class="grow"><button class="btn" data-act="shop-add">Add</button></div>
      </div>
    </div>
  </div>`;
}

/* ---------- Haupt-Render-Schleife ---------- */
function render() {
  if(S.dbState === 'loading') return;
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  if (!app || !tabs) return;

  const TABS = [
    { id: 'heute', label: 'Heute' },
    { id: 'kalender', label: 'Kalender' },
    { id: 'woche', label: 'Woche' },
    { id: 'faecher', label: 'Fächer' },
    { id: 'todos', label: 'Alltag' }
  ];

  tabs.innerHTML = TABS.map(t => `<button role="tab" aria-selected="${S.tab === t.id}" data-act="tab" data-id="${t.id}">${t.label}</button>`).join('');

  let html = '';
  if (S.tab === 'heute') html = viewHeute();
  else if (S.tab === 'kalender') html = viewKalender();
  else if (S.tab === 'woche') html = viewWoche();
  else if (S.tab === 'faecher') html = viewFaecher();
  else if (S.tab === 'todos') html = viewTodos();
  
  app.innerHTML = (timerBarHTML() || '') + html;
  
  const layer = document.getElementById('layer');
  if (layer) layer.innerHTML = dialogHTML();
}

/* ---------- Klick-Logik & Interaktionen ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;

  // Navigation & Layout
  if (act === 'tab') { S.tab = a.dataset.id; ls.set('lt-tab', S.tab); render(); window.scrollTo(0, 0); }
  if (act === 'fach-sel') { S.fachSel = a.dataset.id; ls.set('lt-fach', S.fachSel); render(); }
  if (act === 'ftab') { S.fachTab = a.dataset.t; render(); }
  
  if (act === 'close' || act === 'close-bg') { 
    if(act==='close-bg' && e.target !== a) return; 
    S.dialog = null; S.inline = null; render(); 
  }
  if (act === 'theme') {
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nxt = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', nxt);
    ls.set('lt-theme', nxt);
  }
  
  // Wochenziele
  if (act === 'save-week-goals') {
    const val = document.getElementById('week-goals').value;
    saveWeek(a.dataset.mon, {goals: val});
    toast('Wochenziele gespeichert');
  }

  // Kalender Navigation
  if (act === 'wk') { S.weekOff = a.dataset.d === '0' ? 0 : S.weekOff + parseInt(a.dataset.d); render(); }

  // Todos & Einkaufen
  if (act === 'todo-add') {
    const el = document.getElementById('new-todo');
    if(el.value.trim()) { saveTodo(null, {text: el.value.trim(), done: false}); el.value = ''; }
  }
  if (act === 'todo-toggle') {
    const t = S.todos.find(x=>x.id===a.dataset.id);
    if(t) saveTodo(t.id, {done: !t.done});
  }
  if (act === 'todo-del') delTodo(a.dataset.id);

  if (act === 'shop-add') {
    const el = document.getElementById('new-shop');
    if(el.value.trim()) { saveShop(null, {text: el.value.trim(), bought: false}); el.value = ''; }
  }
  if (act === 'shop-toggle') {
    const t = S.shopping.find(x=>x.id===a.dataset.id);
    if(t) saveShop(t.id, {bought: !t.bought});
  }
  if (act === 'shop-del') delShop(a.dataset.id);

  // Fächer & Themen
  if (act === 'tp-add') {
    const el = document.getElementById('new-tp-'+a.dataset.id);
    if(el && el.value.trim()){
      const s = S.subjects[a.dataset.id] || {};
      const topics = s.topics || [];
      topics.push({id: 't'+Date.now(), t: el.value.trim(), done: false});
      saveSubject(a.dataset.id, {topics});
      el.value = '';
    }
  }
  if (act === 'tp-toggle') {
    const s = S.subjects[a.dataset.id];
    if(s) {
      const topics = s.topics.map(t => t.id === a.dataset.tid ? {...t, done: !t.done} : t);
      saveSubject(a.dataset.id, {topics});
    }
  }
  if (act === 'tp-del') {
    const s = S.subjects[a.dataset.id];
    if(s) {
      const topics = s.topics.filter(t => t.id !== a.dataset.tid);
      saveSubject(a.dataset.id, {topics});
    }
  }
  if (act === 'save-note') {
    const s = S.subjects[a.dataset.id];
    const el = document.getElementById(`note-${a.dataset.id}-${a.dataset.tab}`);
    if(s && el) {
      const itemNotes = s.itemNotes || {};
      itemNotes[a.dataset.tab] = el.value;
      saveSubject(a.dataset.id, {itemNotes});
      toast('Notiz gespeichert');
    }
  }
});

// Event Listener für Textfelder der Lernblock-Vorhaben
document.addEventListener('change', e => {
  if(e.target.dataset.act === 'goal-input') {
    saveGoal(e.target.dataset.block, e.target.dataset.date, e.target.value);
    toast('Vorhaben gespeichert');
  }
});

// Init
window.addEventListener('hashchange', () => { S.mini = location.hash === '#mini'; render(); });
// Manueller Fallback, falls DB nicht rechtzeitig lädt
if(S.dbState !== 'loading') render();

</script>
